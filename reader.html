<!DOCTYPE html>
<!-- READER_HTML_VERSION: 24 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reader</title>
<meta name="rating" content="adult">
<meta name="RTA" content="RTA-5042-1996-1400-1577-RTA">

<!-- Mondiad banner ad script -->
<!-- banner.js is loaded dynamically in JS, after ad divs exist —
     see injectAdSlots() — not statically here, to avoid a load-order
     race: as a static async tag, this script could run before
     renderComic() ever creates any .ad-slot-container elements,
     meaning it would find zero data-mndbanid elements on its one
     and only scan of the page. -->

<style>
  :root{
    --bg: #15161a;
    --bg-raised: #1d1f26;
    --line: #2a2d36;
    --text: #e8e8ec;
    --text-dim: #8b8d98;
    --accent: #ff5a7a;
    --brand-orange: #f59e0b;
    --tg-blue: #29a9eb;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 48px;
  }

  /* ---------- Title block ---------- */
  .title-block{
    padding: 20px 16px 24px;
    border-bottom: 1px solid var(--line);
  }
  .title-block h1{
    font-size: 1.5rem;
    line-height: 1.3;
    margin: 0 0 14px;
    font-weight: 800;
  }
  .stats-row{
    display:flex;
    align-items:center;
    gap: 10px 16px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .stats-row span{
    display:flex;
    align-items:center;
    gap: 4px;
  }
  .rating-pill{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background: rgba(245,158,11,0.15);
    color: var(--brand-orange);
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
  }
  .ntr-tag{
    display:inline-block;
    background: rgba(255,90,122,0.15);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 5px;
  }

  /* Info card grid — mirrors arccomic.github.io's AUTHOR/CODE/CATEGORY/
     LANGUAGE/FULL COLOR/NTR card layout exactly, two per row. */
  .info-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .info-card{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .info-card .icon{
    flex-shrink:0;
    width: 34px; height: 34px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1rem;
  }
  .info-card .label{
    display:block;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .info-card .value{
    display:block;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-decoration: none;
  }
  a.info-card, a.value, .info-card a.value{
    cursor: pointer;
  }
  .info-card a.value:active, .info-card a.value:hover{
    text-decoration: underline;
  }

  .tags-row{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .tag-chip{
    font-size: 0.72rem;
    color: var(--text-dim);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    padding: 3px 9px;
    border-radius: 20px;
    text-decoration: none;
    display: inline-block;
  }
  a.tag-chip:active, a.tag-chip:hover{
    color: var(--text);
    border-color: var(--text-dim);
  }

  /* ---------- Header ---------- */
  .site-header{
    display:flex;
    align-items:center;
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }
  .site-header a{
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color: var(--brand-orange);
    font-size: 1.15rem;
    font-weight: 700;
  }

  /* ---------- Back-to-channel button ---------- */
  .back-button-wrap{
    padding: 24px 16px 8px;
    text-align:center;
  }
  .back-button{
    display:inline-block;
    width:100%;
    max-width: 400px;
    padding: 14px 20px;
    background: var(--brand-orange);
    color: #15161a;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration:none;
    border-radius: 10px;
  }

  /* ---------- Footer follow-links ---------- */
  .follow-section{
    padding: 28px 16px 8px;
  }
  .follow-section h3{
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--brand-orange);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .follow-card{
    display:flex;
    align-items:center;
    gap: 12px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    text-decoration:none;
    color: var(--text);
  }
  .follow-icon{
    flex-shrink:0;
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--tg-blue);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1.1rem;
  }
  .follow-icon.x{ background:#000; border:1px solid var(--line); }
  .follow-text{ flex:1; min-width:0; }
  .follow-text .name{ font-weight:700; font-size:0.95rem; }
  .follow-text .desc{ font-size:0.8rem; color: var(--text-dim); margin-top:2px; }
  .follow-arrow{ color: var(--text-dim); font-size:1.1rem; flex-shrink:0; }


  /* Ad container sits with its own top/bottom margin, no label or
     divider line — ads are visually distinct on their own. */
  .ad-slot-container{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin: 22px 0;
  }

  /* ---------- Reading mode toggle ---------- */
  .mode-toggle-row{
    display:flex;
    gap: 10px;
    padding: 0 16px 18px;
  }
  .mode-toggle-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text-dim);
    font-weight: 700;
    font-size: 0.9rem;
    cursor:pointer;
  }
  .mode-toggle-btn.active{
    border-color: var(--brand-orange);
    color: var(--brand-orange);
    background: rgba(245,158,11,0.10);
  }

  /* ---------- Paginated mode ---------- */
  /* Normal document flow — NOT position:fixed. Ads sit before and
     after the page image and scroll naturally with the rest of the
     page, like a sandwich: ad -> image -> nav bar -> ad. */
  .paginated-wrap{
    display:flex;
    flex-direction:column;
    width:100%;
    max-width:720px;
    margin: 0 auto;
  }

  .paginated-stage{
    position: relative;
    width:100%;
  }
  .paginated-stage img{
    display:block;
    width:100%;
    height:auto;
    background: var(--bg-raised);
  }
  .tap-zone{
    position:absolute;
    top:0; bottom:0;
    width:50%;
    /* invisible — purely a hit target, no visual change on tap */
  }
  .tap-zone.left{ left:0; }
  .tap-zone.right{ right:0; }

  /* Nav bar — sits between the image and the bottom ad, nhentai-style:
     jump-to-first/last (double chevrons) + prev/next (single chevron)
     + page counter in the middle. */
  .paginated-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    padding: 14px 0;
  }
  .paginated-nav button{
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .paginated-nav button:disabled{
    opacity: 0.35;
    cursor: default;
  }
  .paginated-nav .pg-counter{
    padding: 0 10px;
    font-size: 0.85rem;
    color: var(--text-dim);
    white-space: nowrap;
  }


  /* ---------- Pages (scroll mode) ---------- */
  .page{
    display:block;
    width:100%;
    line-height:0; /* kill inline-img gap */
  }
  .page img{
    display:block;
    width:100%;
    height:auto;
    background: var(--bg-raised);
  }
  .page-num{
    text-align:center;
    font-size: 0.72rem;
    color: var(--text-dim);
    padding: 6px 0;
    background: var(--bg);
  }

  /* ---------- States ---------- */
  .state{
    padding: 60px 20px;
    text-align:center;
    color: var(--text-dim);
  }
  .state h2{
    color: var(--text);
    font-size: 1.1rem;
    margin: 0 0 8px;
  }
  .state p{
    font-size: 0.9rem;
    line-height: 1.5;
    max-width: 320px;
    margin: 0 auto;
  }
  .spinner{
    width: 26px; height: 26px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .end-note{
    text-align:center;
    padding: 28px 16px 4px;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="wrap" id="wrap">
  <div class="state" id="loadingState">
    <div class="spinner"></div>
    <h2>Loading comic…</h2>
  </div>
</div>

<script>
(function(){

  let siteConfig = null; // fetched once, reused for header + footer

  // Ad slot markup — each call gets its own placeholder container with
  // a unique id. The actual data-mndbanid div for each slot is created
  // fresh via JS afterward (see injectAdSlots), NOT baked into this
  // HTML string. Multiple identical static data-mndbanid elements
  // stamped into one page at once appears to be why every ad slot
  // returned zero fill — ad networks commonly only serve the first
  // instance of a given zone id per pageview and silently ignore
  // duplicates. This matches the fix that got ads working on the
  // sister site: inject a fresh div exactly when/where it's needed,
  // rather than pre-rendering several copies at once.
  // data-ad-slot on each container picks which Adsterra unit fills
  // it — "top" (title/paginated slots, dashboard-configurable
  // 300x250), "reading" (reading-page slots in scroll mode, fixed
  // 468x60, capped at MAX_READING_AD_SLOTS per comic), or "bottom"
  // (after the last page / paginated bottom, fixed 160x300). Mondiad
  // ignores this attribute entirely — it has only ever used one zone
  // ID regardless of placement.
  let _adSlotCounter = 0;
  // forceNetwork (optional): stamps a data-ad-network attribute on this
  // specific slot, used only by reading-slot rotation to pin a block to a
  // particular network regardless of the page's overall selected network.
  // Top/bottom callers never pass this, so those slots carry no such
  // attribute and fall through to the normal selected-network behavior.
  function adSlotHTML(slotType, forceNetwork){
    const slotId = 'ad-slot-' + (_adSlotCounter++);
    const netAttr = forceNetwork ? ' data-ad-network="' + forceNetwork + '"' : '';
    return '<div class="ad-slot-container" id="' + slotId + '" data-ad-slot="' + slotType + '"' + netAttr + '></div>';
  }

  // Hard cap on reading-page ad slots per comic, regardless of page
  // count. Previously one slot was inserted every 9 pages with no
  // ceiling, so a 54-page comic could carry 5+ reading slots on top
  // of the top/bottom ones — Adsterra support (bot reply, ticket
  // #134522818, 2026-09-19) recommended keeping total ads on one
  // page around 4 max. With top + bottom fixed at 1 each, 3 is the
  // most reading slots that still respects that ceiling for any
  // comic length. Slots are spaced evenly through the comic (see
  // renderScroll) rather than at a fixed page interval, so a
  // short comic still gets fewer/no reading ads and a long one
  // never exceeds this count.
  const MAX_READING_AD_SLOTS = 3;  // Mondiad path only; Hilltop uses exactly 1 (see renderScroll)

  // Tap-link monetization (any network's direct link), scroll mode only — see
  // HANDOFF.md for the full compliance reasoning (ticket #134522818,
  // Daniel from Adsterra Publishers, 2026-09-20: same-user repeat
  // clicks across different days are fine as long as they're organic,
  // not bot/motivated/fraudulent traffic). Design constraints that
  // shaped this, all from Adil directly:
  //   - Paginated mode is deliberately excluded — tapping the image
  //     there already turns pages; hijacking that tap to navigate
  //     away would break the core reading interaction. Scroll mode's
  //     page taps do nothing today, so this is a genuinely new,
  //     non-conflicting behavior there.
  //   - Fires on the FIRST tap on any page image, once per comic
  //     (identified by its ?code=), once per calendar day — not more,
  //     regardless of how many times that comic is re-tapped that same
  //     day. Reading a *different* comic the same day fires again
  //     (independent key). Reading the *same* comic again tomorrow
  //     fires again (day resets it). This was Adil's own proposed
  //     design, chosen specifically to stay unambiguously inside
  //     "organic return traffic" — never a rate that could look
  //     scripted or forced.
  //   - Tags/artist links are explicitly excluded — comic page images
  //     only.
  //   - No auto-return after navigating to the smartlink — Adil's
  //     explicit call. The user taps back in Telegram's in-app
  //     WebView (confirmed single-tab, no multi-tab support) to
  //     resume reading. No countdown page, no return-URL plumbing.
  //   - Fully client-side (localStorage), no backend involved — fits
  //     the free-tier/GitHub-Pages-only hosting constraint Adil
  //     flagged; no server-side session storage exists to lean on.
  //   - Gated entirely behind siteConfig.smartlink_enabled, a
  //     dashboard kill switch defaulting to OFF. Checked fresh off
  //     site-config.json on every page load, so toggling it in the
  //     dashboard takes effect for every visitor on their very next
  //     load — no version bump or reader.html redeploy needed, same
  //     mechanism as the ad_network switch elsewhere in this file.
  function maybeFireSmartlink(){
    if (!siteConfig || !siteConfig.smartlink_enabled) return;
    const url = siteConfig.smartlink_url;
    if (!url) return; // enabled but no URL configured yet — no-op, not an error

    // Once per N HOURS per visitor (all comics share one timer) — N is
    // set from the dashboard (site_config.smartlink_hours), default 1 if
    // unset/invalid. Stored client-side only; if storage is unavailable we
    // fail safe by NOT firing rather than risk firing on every tap.
    const key = 'tapLink_lastFired';
    const hours = (siteConfig && Number(siteConfig.smartlink_hours) > 0)
      ? Number(siteConfig.smartlink_hours) : 1;
    const HOUR_MS = hours * 60 * 60 * 1000;
    const now = Date.now();

    try {
      const last = parseInt(window.localStorage.getItem(key) || '0', 10);
      if (last && (now - last) < HOUR_MS) return;
      window.localStorage.setItem(key, String(now));
    } catch (e) {
      return;
    }

    window.location.href = url;
  }

  // Ad network is chosen from the dashboard (site-config.json ->
  // ad_network: "mondiad" | "hilltop" | "clickadilla") and pushed through the
  // same pipeline as branding. Whichever network is NOT active gets zero
  // script tags, zero divs, zero network calls — no leftover/dead
  // fill attempts from the inactive network.
  //
  // forceNetwork (optional): overrides the network for every container
  // passed in, ignoring any per-container data-ad-network attribute. Used
  // by paginated mode's top/bottom refresh (those two slots are always a
  // single network at once, never split) — reading-slot rotation in
  // scroll mode instead relies on each container's own data-ad-network
  // attribute (see below), since a single injectAdSlots() call there
  // covers many slots that may each belong to a different network.
  //
  // Without forceNetwork, containers are grouped by their own
  // data-ad-network attribute (set by adSlotHTML for rotated reading
  // slots) with any container lacking that attribute (top, bottom, and
  // every reading slot when rotation is off) falling back to the
  // dashboard-selected siteConfig.ad_network — exactly the original
  // single-network behavior, unchanged, for every case rotation doesn't
  // touch.
  function injectAdSlots(containers, forceNetwork){
    containers = containers || document.querySelectorAll('.ad-slot-container');
    if (containers.length === 0) return;

    const defaultNetwork = (siteConfig && siteConfig.ad_network) || 'mondiad';

    if (forceNetwork) {
      dispatchToNetwork(forceNetwork, containers);
      return;
    }

    // Group by resolved network so each network's injector runs once
    // with all of its own containers, same as the pre-rotation code did
    // for the (always single) network case.
    const groups = {};
    Array.prototype.forEach.call(containers, function(c){
      const net = c.getAttribute('data-ad-network') || defaultNetwork;
      (groups[net] = groups[net] || []).push(c);
    });
    Object.keys(groups).forEach(function(net){
      dispatchToNetwork(net, groups[net]);
    });
  }

  function dispatchToNetwork(network, containers){
    if (network === 'hilltop') {
      injectHilltopSlots(containers);
    } else if (network === 'clickadilla') {
      injectClickAdillaSlots(containers);
    } else {
      injectMondiadSlots(containers);
    }
  }

  // Re-requests a fresh ad into containers that already have one —
  // used by paginated mode's every-9-page-turns refresh. Clears
  // existing content first so Mondiad/Adsterra don't just find their
  // old div/iframe still sitting there and skip re-serving.
  function refreshAdSlots(containers, forceNetwork){
    containers.forEach(function(c){ c.innerHTML = ''; });
    injectAdSlots(containers, forceNetwork);
  }

  // ---------- Multi-network reading-slot rotation ----------
  //
  // OFF by default (site-config.json's "multi_network_rotation_enabled").
  // When off, every code path below is a no-op and behavior is byte-for-byte
  // what it was before this feature existed: top/bottom + reading slots all
  // come from the single dashboard-selected ad_network, exactly as today.
  //
  // When ON: top and bottom are STILL untouched — always the selected
  // network, same as always. Only the in-content reading slots rotate.
  // Reading content is split into blocks (one 9-page group in scroll mode,
  // one 5-page-turn group in paginated mode — each mode's own existing
  // cadence, unchanged). Block 1 always goes to the dashboard-selected
  // network (priority doesn't override the operator's active pick — it
  // only decides who comes AFTER). Block 2 goes to whichever OTHER network
  // has the lowest priority number, block 3 the next, cycling back to the
  // selected network once every configured network has had one block.
  //
  // Priority numbers come from site-config.json's "network_priority"
  // object, e.g. {"mondiad": 3, "hilltop": 2, "clickadilla": 1} — lower
  // fills sooner. A network missing from that object, or with a
  // non-numeric value, sorts last (but is still included in rotation).
  function rotationEnabled(){
    return !!(siteConfig && siteConfig.multi_network_rotation_enabled);
  }

  // Ordered list of networks for the handoff sequence, AFTER the selected
  // one. e.g. selected = clickadilla, priorities mondiad:3, hilltop:2
  // -> returns ['hilltop', 'mondiad'] (hilltop's 2 beats mondiad's 3).
  function rotationHandoffOrder(){
    const ALL = ['mondiad', 'hilltop', 'clickadilla'];
    const selected = (siteConfig && siteConfig.ad_network) || 'mondiad';
    const priorities = (siteConfig && siteConfig.network_priority) || {};
    const rest = ALL.filter(function(n){ return n !== selected; });
    rest.sort(function(a, b){
      const pa = Number(priorities[a]);
      const pb = Number(priorities[b]);
      const va = isFinite(pa) ? pa : 999;
      const vb = isFinite(pb) ? pb : 999;
      return va - vb;
    });
    return rest;
  }

  // Full block-ownership sequence: the selected network normally gets the
  // first TWO blocks, then every other network gets exactly one block
  // each, in priority order, then the whole sequence repeats. e.g.
  // selected = clickadilla, priorities mondiad:3 hilltop:2 ->
  // [clickadilla, clickadilla, hilltop, mondiad], repeating. This (not a
  // flat 1-each round robin) is Adil's explicit spec — the selected/
  // active network is meant to still dominate, priority only governs who
  // fills in behind it.
  //
  // EXCEPTION: Hilltop only ever gets ONE slot in this sequence, even
  // when it's the selected network. Hilltop has exactly one "reading"
  // zone URL (see HILLTOP_DEFAULTS) — giving it two blocks on the same
  // page means the second block reuses that same zone code, which
  // Hilltop simply returns blank fill for (their own "never reused
  // across two slots" rule, same reasoning as this file's original
  // pre-rotation Hilltop handling). Confirmed live by Adil: a blank slot
  // costs real revenue and looks broken to readers, so Hilltop hands off
  // to the next-priority network immediately after its one slot rather
  // than holding a second slot it can't actually fill. Every other
  // network is unaffected — they still get their full two blocks when
  // selected, since Mondiad/ClickAdilla's scripts re-scan for banner
  // divs and don't have this one-zone-per-page restriction.
  function rotationBlockSequence(){
    const selected = (siteConfig && siteConfig.ad_network) || 'mondiad';
    const selectedBlocks = (selected === 'hilltop') ? [selected] : [selected, selected];
    return selectedBlocks.concat(rotationHandoffOrder());
  }

  // blockIndex is 0-based (0 = first reading-slot block encountered).
  // Returns which network owns that block per rotationBlockSequence()
  // above, cycling once the sequence is exhausted.
  function networkForBlock(blockIndex){
    if (!rotationEnabled()) {
      return (siteConfig && siteConfig.ad_network) || 'mondiad';
    }
    const seq = rotationBlockSequence();
    return seq[blockIndex % seq.length];
  }

  // Paginated mode has no separate reading slot — just top+bottom,
  // refreshed together every PAGINATED_AD_REFRESH_EVERY turns. Per Adil:
  // within the SAME refresh cycle, top and bottom deliberately pull from
  // TWO DIFFERENT networks at once (not the same one), and both slots'
  // pointers independently advance one step through the SAME block
  // sequence used by scroll mode's reading slots (selected network first
  // for two cycles, then each other network for one cycle, repeating).
  // slotOffset is 0 for top, 1 for bottom — bottom always starts one
  // position further into the sequence than top, so as long as 2+
  // networks are in play they never coincide.
  function networkForCycle(cycleIndex, slotOffset){
    if (!rotationEnabled()) {
      return (siteConfig && siteConfig.ad_network) || 'mondiad';
    }
    const seq = rotationBlockSequence();
    return seq[(cycleIndex + slotOffset) % seq.length];
  }

  function injectMondiadSlots(containers){
    containers.forEach(function(container){
      const div = document.createElement('div');
      div.setAttribute('data-mndbanid', '79d7aa12-5511-404b-89a3-dbeb4ae4b292');
      container.appendChild(div);
    });

    // Load banner.js only now, after every data-mndbanid div already
    // exists in the DOM — this sidesteps needing to know whether
    // Mondiad's script exposes any kind of manual re-scan/refresh
    // method (it may or may not; that was never actually confirmed,
    // only guessed at in an earlier version of this file). Loading
    // the script fresh each time this function runs means its first
    // and only scan of the page happens after the elements it's
    // looking for are already there — no race condition to work
    // around. Guard against loading it twice if injectAdSlots is
    // somehow called more than once in a page's lifetime.

  // Follow-links footer — mirrors the main site's "Follow Us Links"

  function followFooterHTML(cfg){
    const links = (cfg && Array.isArray(cfg.follow_links)) ? cfg.follow_links : [];
    if (!links.length) return '';

    let html = '<div class="follow-section"><h3>⚡ Follow For More</h3>';
    links.forEach(function(link){
      const platform = (link.platform || '').toLowerCase();
      const isX = platform === 'twitter' || platform === 'x';
      const icon = isX ? '𝕏' : '✈️';
      html +=
        '<a class="follow-card" href="' + escapeAttr(link.url || '#') + '">' +
          '<div class="follow-icon' + (isX ? ' x' : '') + '">' + icon + '</div>' +
          '<div class="follow-text">' +
            '<div class="name">' + escapeHTML(link.name || '') + '</div>' +
            '<div class="desc">' + escapeHTML(link.desc || '') + '</div>' +
          '</div>' +
          '<div class="follow-arrow">↗</div>' +
        '</a>';
    });
    html += '</div>';
    return html;
  }

  function renderComic(data){
    const wrap = document.getElementById('wrap');
    const images = data.images || [];
    const title = data.title || 'Untitled';

    let html = '';

    // Title block — mirrors arccomic.github.io's own post structure:
    // title, a small stats row (rating/pages/NTR), then a grid of
    // labeled info cards (AUTHOR/CODE/CATEGORY/LANGUAGE/FULL COLOR/
    // NTR), then tag chips.
    html += '<div class="title-block">';
    html += '<h1>' + escapeHTML(title) + '</h1>';

    html += '<div class="stats-row">';
    if (data.rating) html += '<span class="rating-pill">⭐ ' + escapeHTML(String(data.rating)) + '</span>';
    if (images.length) html += '<span>' + images.length + ' pages</span>';
    if (data.is_ntr) html += '<span class="ntr-tag">NTR</span>';
    html += '</div>';

    html += '<div class="info-grid">';
    if (data.author) {
      const artistSlug = slugify(data.author);
      const artistHref = 'https://arccomic.github.io/artists/' + escapeAttr(artistSlug) + '/';
      html += '<div class="info-card"><div class="icon">✨</div><div><span class="label">Author</span><a class="value" href="' + artistHref + '">' + escapeHTML(data.author) + '</a></div></div>';
    }
    if (data.code) {
      html += '<div class="info-card"><div class="icon">⭐</div><div><span class="label">Code</span><span class="value">' + escapeHTML(String(data.code)) + '</span></div></div>';
    }
    if (data.categories) {
      html += '<div class="info-card"><div class="icon">⚡</div><div><span class="label">Category</span><span class="value">' + escapeHTML(data.categories) + '</span></div></div>';
    }
    if (data.language) {
      html += '<div class="info-card"><div class="icon">🌐</div><div><span class="label">Language</span><span class="value">' + escapeHTML(String(data.language)) + '</span></div></div>';
    }
    if (data.full_color) {
      const isColor = String(data.full_color).toLowerCase() === 'yes';
      html += '<div class="info-card"><div class="icon">🎨</div><div><span class="label">Full Color</span><span class="value">' + (isColor ? 'Yes' : 'No') + '</span></div></div>';
    }
    html += '<div class="info-card"><div class="icon">🌙</div><div><span class="label">NTR</span><span class="value">' + (data.is_ntr ? 'Yes' : 'No') + '</span></div></div>';
    html += '</div>';

    if (Array.isArray(data.tags) && data.tags.length){
      html += '<div class="tags-row">';
      data.tags.forEach(function(tag){
        const tagSlug = slugify(tag);
        const tagHref = 'https://arccomic.github.io/tags/' + escapeAttr(tagSlug) + '/';
        html += '<a class="tag-chip" href="' + tagHref + '">' + escapeHTML(tag) + '</a>';
      });
      html += '</div>';
    }

    html += '</div>';

    // Reading-mode toggle — two buttons, side by side, right after
    // tags/info and before any pages/ads. Persisted in localStorage
    // so it's remembered site-wide on the next comic too. Gated
    // server-side by site-config.json's paginated_mode_enabled — a
    // dashboard kill switch. When disabled, these buttons never even
    // render, so every visitor gets Scroll mode regardless of
    // whatever they may have saved in localStorage from an earlier
    // session while testing was on.
    if (siteConfig && siteConfig.paginated_mode_enabled) {
      html += '<div class="mode-toggle-row" id="modeToggleRow">' +
        '<button class="mode-toggle-btn" id="modeBtnScroll">📜 Scroll</button>' +
        '<button class="mode-toggle-btn" id="modeBtnPaginated">📖 Paginated</button>' +
      '</div>';
    }

    // Everything mode-dependent (ad slots + page images) lives inside
    // #pagesArea so switching modes only re-renders this one section —
    // header, title block, tags, back button, and footer never move.
    html += '<div id="pagesArea"></div>';

    // Back-to-channel button, then the follow-links footer — both
    // editable from the dashboard, both optional (skip cleanly if
    // site-config.json is missing/unconfigured). These sit AFTER
    // pagesArea in the DOM always, regardless of reading mode.
    html += backButtonHTML(siteConfig);
    html += followFooterHTML(siteConfig);

    wrap.innerHTML = html;

    _currentImages = images;
    initModeToggle();
    renderPagesArea(images);
  }

  // ---------- Reading mode: state + toggle ----------

  let _currentImages = [];
  const READING_MODE_KEY = 'readingMode'; // localStorage key, site-wide

  // Server-side kill switch wins over any client-saved preference.
  // If the dashboard has paginated mode disabled, this always
  // returns 'scroll' — a leftover localStorage value from an earlier
  // test period is never honored while the switch is off.
  function getReadingMode(){
    if (!siteConfig || !siteConfig.paginated_mode_enabled) return 'scroll';
    const saved = localStorage.getItem(READING_MODE_KEY);
    return (saved === 'paginated') ? 'paginated' : 'scroll'; // scroll is the default
  }
  function setReadingMode(mode){
    localStorage.setItem(READING_MODE_KEY, mode);
  }

  function initModeToggle(){
    const scrollBtn = document.getElementById('modeBtnScroll');
    const pagBtn = document.getElementById('modeBtnPaginated');
    if (!scrollBtn || !pagBtn) return; // buttons don't exist while the kill switch is off

    function paint(){
      const mode = getReadingMode();
      scrollBtn.classList.toggle('active', mode === 'scroll');
      pagBtn.classList.toggle('active', mode === 'paginated');
    }
    paint();

    scrollBtn.addEventListener('click', function(){
      if (getReadingMode() === 'scroll') return;
      setReadingMode('scroll');
      paint();
      renderPagesArea(_currentImages);
    });
    pagBtn.addEventListener('click', function(){
      if (getReadingMode() === 'paginated') return;
      setReadingMode('paginated');
      paint();
      renderPagesArea(_currentImages);
    });
  }

  // Renders whichever mode is currently active into #pagesArea.
  // Called on first load and every time the toggle is tapped.
  function renderPagesArea(images){
    const mode = getReadingMode();
    if (mode === 'paginated') {
      renderPaginated(images);
    } else {
      renderScroll(images);
    }
  }

  // ---------- Scroll mode (original behavior, unchanged) ----------

  function renderScroll(images){
    const area = document.getElementById('pagesArea');
    if (!area) return;

    let html = '';

    // Ad right after title, before first page — top slot (300x250)
    html += adSlotHTML('top');

    // Reading-page ad slots: placed every 9th page (9, 18, 27...), capped
    // at MAX_READING_AD_SLOTS total regardless of page count. A short
    // comic (fewer than 9 pages, or fewer 9-multiples than the cap) gets
    // fewer slots, never more than the cap. Never places a slot on the
    // very last page — that's the dedicated "bottom" slot's job.
    // Hilltop's MultiTag scripts are single-load-per-zone, so it's stuck
    // with exactly one reading slot. ClickAdilla has no such per-zone reuse
    // restriction (same as Mondiad — its script just re-scans for banner
    // divs), so it also gets the every-9-pages cadence, just capped higher.
    const _net = siteConfig && siteConfig.ad_network;
    const _rotation = rotationEnabled();

    // Reading-slot pages -> which network owns that block. Without
    // rotation this is exactly the old logic (Hilltop gets one slot at
    // page 9, everyone else gets up to MAX_READING_AD_SLOTS every 9
    // pages) — byte-for-byte the same outcome as before this feature
    // existed. With rotation on, each 9-page block can be owned by a
    // DIFFERENT network per networkForBlock(), and Hilltop's structural
    // one-slot-only limit applies only to the block(s) where Hilltop is
    // the block owner, not to the comic as a whole — a later block owned
    // by Mondiad/ClickAdilla is unaffected by Hilltop having already used
    // its one slot earlier.
    const readingSlotPages = new Map(); // pageNum -> network for that slot
    if (_rotation) {
      let blockIndex = 0;
      for (let p = 9; p < images.length; p += 9) {
        const owner = networkForBlock(blockIndex);
        readingSlotPages.set(p, owner);
        blockIndex++;
        // No cap here: rotation spreads load across networks, so the old
        // single-network MAX_READING_AD_SLOTS ceiling (there to protect
        // one network's page-density policy) doesn't apply the same way.
        // A very long comic still gets a slot every 9 pages, just handed
        // to a different network each block.
      }
    } else if (_net === 'hilltop') {
      if (images.length > 9) readingSlotPages.set(9, 'hilltop');
    } else {
      let count = 0;
      for (let p = 9; p < images.length && count < MAX_READING_AD_SLOTS; p += 9) {
        readingSlotPages.set(p, _net || 'mondiad');
        count++;
      }
    }

    images.forEach(function(src, i){
      const pageNum = i + 1;
      html += '<div class="page">';
      html += '<img src="' + escapeAttr(src) + '" loading="lazy" alt="Page ' + pageNum + '">';
      html += '<div class="page-num">' + pageNum + ' / ' + images.length + '</div>';
      html += '</div>';

      if (readingSlotPages.has(pageNum) && pageNum !== images.length){
        html += adSlotHTML('reading', readingSlotPages.get(pageNum));
      }
    });

    // Final ad after the last page — bottom slot (160x300)
    html += adSlotHTML('bottom');
    html += '<div class="end-note">End of comic</div>';

    area.innerHTML = html;
    injectAdSlots();

    // Smartlink: one listener per page image, all sharing the same
    // maybeFireSmartlink() gate — only the first tap of the day across
    // ALL of this comic's page images actually navigates anywhere;
    // every tap after that (this comic, today) is a silent no-op, same
    // as before this feature existed. Attached here (after
    // area.innerHTML is set) rather than via event delegation on
    // `area`, since these <img> elements are static once rendered —
    // no need for delegation's extra indirection.
    area.querySelectorAll('.page img').forEach(function(img){
      img.addEventListener('click', maybeFireSmartlink);
    });
  }

  // ---------- Paginated mode ----------
  //
  // One page visible at a time, in the order: ad -> image -> nav bar
  // -> ad. All in normal document flow (NOT position:fixed) — ads
  // scroll naturally with the page like a sandwich around the image,
  // not pinned to the viewport edges. Left-half/right-half invisible
  // tap zones AND the nav bar's prev/next buttons both move pages.
  // Both ad slots refresh every 5 page-turns (scroll mode's own
  // every-9-pages cadence is untouched — this only applies here).
  // Page turns are pure JS (swap which <img> is shown) — never a
  // real navigation — so there's no reload and no scroll-to-top.

  const PAGINATED_AD_REFRESH_EVERY = 5;

  let _pgIndex = 0;          // 0-based current page
  let _pgImages = [];
  let _pgTurnCount = 0;      // turns since last ad refresh
  let _pgLoaded = {};        // cache of Image() objects already requested, by index
  let _pgCycleIndex = 0;     // which 5-turn refresh cycle we're in, for rotation

  function renderPaginated(images){
    const area = document.getElementById('pagesArea');
    if (!area) return;

    _pgImages = images;
    _pgIndex = 0;
    _pgTurnCount = 0;
    _pgLoaded = {};
    _pgCycleIndex = 0;

    area.innerHTML =
      '<div class="paginated-wrap">' +
        '<div class="ad-slot-container" id="pgAdTop" data-ad-slot="top"></div>' +
        '<div class="paginated-stage" id="pgStage">' +
          '<img id="pgImage" alt="">' +
          '<div class="tap-zone left" id="pgTapLeft"></div>' +
          '<div class="tap-zone right" id="pgTapRight"></div>' +
        '</div>' +
        '<div class="paginated-nav">' +
          '<button id="pgFirst" title="First page">&laquo;</button>' +
          '<button id="pgPrev" title="Previous page">&lsaquo;</button>' +
          '<span class="pg-counter" id="pgCounter"></span>' +
          '<button id="pgNext" title="Next page">&rsaquo;</button>' +
          '<button id="pgLast" title="Last page">&raquo;</button>' +
        '</div>' +
        '<div class="ad-slot-container" id="pgAdBottom" data-ad-slot="bottom"></div>' +
      '</div>';

    // Both ad slots injected once here — refreshAdSlots() re-fills
    // them in place later without touching anything else on rerender.
    // Rotation off: both slots get the selected network via the normal
    // injectAdSlots(containers) path, unchanged. Rotation on: top and
    // bottom are injected SEPARATELY, each forced to its own network for
    // cycle 0 (see networkForCycle) — this is the only place besides
    // pgMaybeRefreshAds where they can differ.
    if (rotationEnabled()) {
      injectAdSlots(document.querySelectorAll('#pgAdTop'), networkForCycle(0, 0));
      injectAdSlots(document.querySelectorAll('#pgAdBottom'), networkForCycle(0, 1));
    } else {
      injectAdSlots(document.querySelectorAll('#pgAdTop, #pgAdBottom'));
    }

    document.getElementById('pgTapLeft').addEventListener('click', function(){ pgTurn(-1); });
    document.getElementById('pgTapRight').addEventListener('click', function(){ pgTurn(1); });
    document.getElementById('pgPrev').addEventListener('click', function(){ pgTurn(-1); });
    document.getElementById('pgNext').addEventListener('click', function(){ pgTurn(1); });
    document.getElementById('pgFirst').addEventListener('click', function(){ pgJump(0); });
    document.getElementById('pgLast').addEventListener('click', function(){ pgJump(_pgImages.length - 1); });

    pgShow(0);
    pgPreloadAround(0);
  }

  function pgShow(index){
    if (index < 0 || index >= _pgImages.length) return;
    _pgIndex = index;
    const img = document.getElementById('pgImage');
    if (img) {
      img.src = _pgImages[index];
      img.alt = 'Page ' + (index + 1);
    }
    const counter = document.getElementById('pgCounter');
    if (counter) counter.textContent = (index + 1) + ' / ' + _pgImages.length;

    const prevBtn = document.getElementById('pgPrev');
    const nextBtn = document.getElementById('pgNext');
    const firstBtn = document.getElementById('pgFirst');
    const lastBtn = document.getElementById('pgLast');
    if (prevBtn) prevBtn.disabled = (index <= 0);
    if (firstBtn) firstBtn.disabled = (index <= 0);
    if (nextBtn) nextBtn.disabled = (index >= _pgImages.length - 1);
    if (lastBtn) lastBtn.disabled = (index >= _pgImages.length - 1);
  }

  // Preloads the current page plus the next 2 (3 total in flight/cached)
  // so tapping forward feels instant rather than load-then-wait.
  function pgPreloadAround(index){
    for (let offset = 0; offset <= 2; offset++){
      const i = index + offset;
      if (i >= _pgImages.length || _pgLoaded[i]) continue;
      const im = new Image();
      im.src = _pgImages[i];
      _pgLoaded[i] = im;
    }
  }

  function pgMaybeRefreshAds(){
    _pgTurnCount++;
    if (_pgTurnCount >= PAGINATED_AD_REFRESH_EVERY){
      _pgTurnCount = 0;
      _pgCycleIndex++;
      const _net = siteConfig && siteConfig.ad_network;
      if (rotationEnabled()) {
        // Top and bottom each get their own network for the new cycle —
        // may genuinely differ from each other (see networkForCycle).
        // Hilltop's single-load-per-zone limitation still applies: if
        // Hilltop happens to own a slot this cycle, that slot simply
        // doesn't get a fresh reload (same restriction it always had),
        // while the OTHER slot (if owned by Mondiad/ClickAdilla) still
        // refreshes normally.
        const topNet = networkForCycle(_pgCycleIndex, 0);
        const bottomNet = networkForCycle(_pgCycleIndex, 1);
        const pgTop = document.getElementById('pgAdTop');
        const pgBottom = document.getElementById('pgAdBottom');
        // Hilltop's "never fill twice" guard (data-hilltop-loaded) is only
        // meant to stop the SAME already-filled Hilltop slot from being
        // re-requested — it's not meant to permanently lock a slot out of
        // ever getting a fresh Hilltop ad again on some LATER cycle after
        // rotation has moved it to another network and back. Clear the
        // flag whenever a slot isn't Hilltop's this cycle, so if rotation
        // hands it back to Hilltop later, that slot is treated as fresh.
        if (pgTop && topNet !== 'hilltop') pgTop.removeAttribute('data-hilltop-loaded');
        if (pgBottom && bottomNet !== 'hilltop') pgBottom.removeAttribute('data-hilltop-loaded');
        if (topNet !== 'hilltop') {
          refreshAdSlots(document.querySelectorAll('#pgAdTop'), topNet);
        }
        if (bottomNet !== 'hilltop') {
          refreshAdSlots(document.querySelectorAll('#pgAdBottom'), bottomNet);
        }
      } else if (_net !== 'hilltop') {
        // Hilltop MultiTag banners are single-load scripts: re-injecting the
        // same zone code repeatedly would stack duplicate loads. Mondiad and
        // ClickAdilla both just re-scan for their own divs, so they get the
        // periodic in-place refresh.
        refreshAdSlots(document.querySelectorAll('#pgAdTop, #pgAdBottom'));
      }
    }
  }

  function pgTurn(delta){
    const next = _pgIndex + delta;
    if (next < 0 || next >= _pgImages.length) return; // no-op at the ends

    pgShow(next);
    pgPreloadAround(next);
    pgMaybeRefreshAds();
  }

  // Direct jump (first/last buttons) — same ad-refresh counting as a
  // normal turn, since it's still one navigation action by the reader.
  function pgJump(index){
    if (index === _pgIndex) return;
    pgShow(index);
    pgPreloadAround(index);
    pgMaybeRefreshAds();
  }


  function escapeHTML(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function escapeAttr(str){
    return String(str).replace(/"/g, '&quot;');
  }

  // Turns a tag/artist name into arccomic.github.io's own URL-slug
  // format so links line up with that site's existing pattern, e.g.
  // "Okumori Boy" -> "okumori-boy", "Mojarin" -> "mojarin". Lowercase,
  // spaces/underscores -> hyphens, strip anything that isn't
  // alphanumeric or a hyphen, collapse repeats, trim leading/trailing
  // hyphens.
  function slugify(str){
    return String(str)
      .toLowerCase()
      .trim()
      .replace(/[\s_]+/g, '-')
      .replace(/[^a-z0-9-]/g, '')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');
  }

  async function loadSiteConfig(){
    try{
      const res = await fetch('site-config.json', { cache: 'no-store' });
      if (res.ok) siteConfig = await res.json();
    } catch(err){
      // Branding is optional — a missing/unreachable site-config.json
      // should never block the comic itself from rendering.
      siteConfig = null;
    }
    renderHeader(siteConfig);
  }

  async function init(){
    await loadSiteConfig();

    const code = getCodeFromURL();
    if (!code){
      renderNotAvailable('No comic code was provided in the link.');
      return;
    }

    try{
      const res = await fetch('data/' + encodeURIComponent(code) + '.json', { cache: 'no-store' });
      if (!res.ok){
        renderNotAvailable('This comic isn\'t in our library yet. Check back later.');
        return;
      }
      const data = await res.json();
      if (!data || !Array.isArray(data.images) || data.images.length === 0){
        renderNotAvailable('This comic\'s pages couldn\'t be loaded.');
        return;
      }
      renderComic(data);
    } catch(err){
      renderNotAvailable('Something went wrong loading this comic. Please try again.');
    }
  }

  init();
})();
</script>

<!-- ============================================================
     18+ AGE GATE — overlay only.
     - Sits ON TOP of the page. Comic content/HTML underneath is untouched,
       so nothing is hidden from search engines.
     - No redirect, no URL change. ?code= handling is not involved.
     - Remembered per browser in localStorage under its own key
       ('ageGateOk_v1') — does not touch 'readingMode' or ad keys.
     - Search-engine crawlers are detected and never shown the gate.
     - "Leave" only navigates on a real human click.
     ============================================================ -->
<style>
  #ageGate{
    position:fixed; inset:0; z-index:2147483000;

  }
  .site-legal-links a{ color:#8b8d98; margin:0 8px; text-decoration:underline; }
</style>

<div id="ageGate" role="dialog" aria-modal="true" aria-labelledby="agTitle">
  <div class="ag-box">
    <div class="ag-badge">18+</div>
    <h2 id="agTitle">Adults only</h2>
    <p>This website contains adult content. You must be 18 years or older to enter.</p>
    <div class="ag-btns">
      <button type="button" class="ag-yes" id="agYes">Yes, I'm 18 or older</button>
      <button type="button" class="ag-no"  id="agNo">Leave</button>
    </div>
    <div class="ag-small">
      By entering you confirm you are of legal age where you live.
      <a href="dmca.html">DMCA</a> · <a href="2257.html">2257</a>
    </div>
  </div>
</div>

<div class="site-legal-links">
  <a href="dmca.html">DMCA</a> · <a href="2257.html">18 U.S.C. 2257</a>
</div>

<script>
(function(){
  var KEY = 'ageGateOk_v1';
  var LEAVE_URL = 'https://t.me/ArcComic';   // <-- where "Leave" sends people

  // Search-engine / preview crawlers never see the gate.
  var ua = (navigator.userAgent || '');
  var isBot = /googlebot|bingbot|slurp|duckduckbot|baiduspider|yandex|sogou|exabot|facebot|ia_archiver|applebot|petalbot|semrush|ahrefs|mj12bot|telegrambot|twitterbot|whatsapp|discordbot/i.test(ua);
  if (isBot) return;

  var gate = document.getElementById('ageGate');
  if (!gate) return;

  var ok = false;
  try { ok = window.localStorage.getItem(KEY) === '1'; } catch(e) { ok = false; }
  if (ok) return;                       // already verified on this browser

  gate.classList.add('show');
  document.documentElement.style.overflow = 'hidden';   // stop background scroll while gate is up

  function closeGate(){
    gate.classList.remove('show');
    document.documentElement.style.overflow = '';
  }

  document.getElementById('agYes').addEventListener('click', function(){
    try { window.localStorage.setItem(KEY, '1'); } catch(e) {}
    closeGate();
  });

  document.getElementById('agNo').addEventListener('click', function(){
    window.location.href = LEAVE_URL;    // only on a real click
  });
})();
</script>
