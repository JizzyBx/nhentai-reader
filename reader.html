<!DOCTYPE html>
<!-- READER_HTML_VERSION: 3 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reader</title>

<!-- Mondiad banner ad script -->
<script async src="https://ss.mrmnd.com/banner.js"></script>

<style>
  :root{
    --bg: #15161a;
    --bg-raised: #1d1f26;
    --line: #2a2d36;
    --text: #e8e8ec;
    --text-dim: #8b8d98;
    --accent: #ff5a7a;
    --brand-orange: #f59e0b;
    --tg-blue: #29a9eb;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 48px;
  }

  /* ---------- Title block ---------- */
  .title-block{
    padding: 20px 16px 24px;
    border-bottom: 1px solid var(--line);
  }
  .title-block h1{
    font-size: 1.5rem;
    line-height: 1.3;
    margin: 0 0 14px;
    font-weight: 800;
  }
  .stats-row{
    display:flex;
    align-items:center;
    gap: 10px 16px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .stats-row span{
    display:flex;
    align-items:center;
    gap: 4px;
  }
  .rating-pill{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background: rgba(245,158,11,0.15);
    color: var(--brand-orange);
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
  }
  .ntr-tag{
    display:inline-block;
    background: rgba(255,90,122,0.15);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 5px;
  }

  /* Info card grid — mirrors arccomic.github.io's AUTHOR/CODE/CATEGORY/
     LANGUAGE/FULL COLOR/NTR card layout exactly, two per row. */
  .info-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .info-card{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .info-card .icon{
    flex-shrink:0;
    width: 34px; height: 34px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1rem;
  }
  .info-card .label{
    display:block;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .info-card .value{
    display:block;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tags-row{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .tag-chip{
    font-size: 0.72rem;
    color: var(--text-dim);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    padding: 3px 9px;
    border-radius: 20px;
  }

  /* ---------- Header ---------- */
  .site-header{
    display:flex;
    align-items:center;
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }
  .site-header a{
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color: var(--brand-orange);
    font-size: 1.15rem;
    font-weight: 700;
  }

  /* ---------- Back-to-channel button ---------- */
  .back-button-wrap{
    padding: 24px 16px 8px;
    text-align:center;
  }
  .back-button{
    display:inline-block;
    width:100%;
    max-width: 400px;
    padding: 14px 20px;
    background: var(--brand-orange);
    color: #15161a;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration:none;
    border-radius: 10px;
  }

  /* ---------- Footer follow-links ---------- */
  .follow-section{
    padding: 28px 16px 8px;
  }
  .follow-section h3{
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--brand-orange);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .follow-card{
    display:flex;
    align-items:center;
    gap: 12px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    text-decoration:none;
    color: var(--text);
  }
  .follow-icon{
    flex-shrink:0;
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--tg-blue);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1.1rem;
  }
  .follow-icon.x{ background:#000; border:1px solid var(--line); }
  .follow-text{ flex:1; min-width:0; }
  .follow-text .name{ font-weight:700; font-size:0.95rem; }
  .follow-text .desc{ font-size:0.8rem; color: var(--text-dim); margin-top:2px; }
  .follow-arrow{ color: var(--text-dim); font-size:1.1rem; flex-shrink:0; }


  .ad-slot{
    margin: 22px auto;
    padding: 14px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 60px;
  }
  .ad-slot::before,
  .ad-slot::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }
  .ad-slot .ad-label{
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    padding: 0 10px;
    white-space: nowrap;
  }
  /* Actual ad element sits below the divider row */
  .ad-slot-container{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .ad-slot-container > div[data-mndbanid]{
    min-height: 50px;
  }

  /* ---------- Pages ---------- */
  .page{
    display:block;
    width:100%;
    line-height:0; /* kill inline-img gap */
  }
  .page img{
    display:block;
    width:100%;
    height:auto;
    background: var(--bg-raised);
  }
  .page-num{
    text-align:center;
    font-size: 0.72rem;
    color: var(--text-dim);
    padding: 6px 0;
    background: var(--bg);
  }

  /* ---------- States ---------- */
  .state{
    padding: 60px 20px;
    text-align:center;
    color: var(--text-dim);
  }
  .state h2{
    color: var(--text);
    font-size: 1.1rem;
    margin: 0 0 8px;
  }
  .state p{
    font-size: 0.9rem;
    line-height: 1.5;
    max-width: 320px;
    margin: 0 auto;
  }
  .spinner{
    width: 26px; height: 26px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .end-note{
    text-align:center;
    padding: 28px 16px 4px;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="wrap" id="wrap">
  <div class="state" id="loadingState">
    <div class="spinner"></div>
    <h2>Loading comic…</h2>
  </div>
</div>

<script>
(function(){

  let siteConfig = null; // fetched once, reused for header + footer

  // Ad slot markup — each call gets its own placeholder container with
  // a unique id. The actual data-mndbanid div for each slot is created
  // fresh via JS afterward (see injectAdSlots), NOT baked into this
  // HTML string. Multiple identical static data-mndbanid elements
  // stamped into one page at once appears to be why every ad slot
  // returned zero fill — ad networks commonly only serve the first
  // instance of a given zone id per pageview and silently ignore
  // duplicates. This matches the fix that got ads working on the
  // sister site: inject a fresh div exactly when/where it's needed,
  // rather than pre-rendering several copies at once.
  let _adSlotCounter = 0;
  function adSlotHTML(){
    const slotId = 'ad-slot-' + (_adSlotCounter++);
    return (
      '<div class="ad-slot"><span class="ad-label">Advertisement</span></div>' +
      '<div class="ad-slot-container" id="' + slotId + '"></div>'
    );
  }

  function injectAdSlots(){
    const containers = document.querySelectorAll('.ad-slot-container');
    containers.forEach(function(container){
      const div = document.createElement('div');
      div.setAttribute('data-mndbanid', '79d7aa12-5511-404b-89a3-dbeb4ae4b292');
      container.appendChild(div);
    });
    // banner.js reads data-mndbanid elements present in the DOM when
    // it loads; since it's loaded with `async` in <head>, it may have
    // already run before these elements existed. If it exposes a
    // manual re-scan/refresh hook, call it now so it picks up the
    // freshly-added divs instead of only ones present at its own
    // initial load.
    if (window.mndBanner && typeof window.mndBanner.refresh === 'function'){
      window.mndBanner.refresh();
    } else if (window.MNDBanner && typeof window.MNDBanner.refresh === 'function'){
      window.MNDBanner.refresh();
    }
  }

  function getCodeFromURL(){
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    return code ? code.trim() : null;
  }

  // Header logo — editable from the dashboard (text + link). Renders
  // even while the comic itself is loading/erroring, so it always
  // sits above whatever state is currently in #wrap.
  function renderHeader(cfg){
    const el = document.getElementById('siteHeader');
    if (!cfg || !cfg.header_logo_text){
      el.innerHTML = '';
      return;
    }
    const url = cfg.header_logo_url || '#';
    el.innerHTML =
      '<div class="site-header">' +
        '<a href="' + escapeAttr(url) + '">' + escapeHTML(cfg.header_logo_text) + '</a>' +
      '</div>';
  }

  function backButtonHTML(cfg){
    if (!cfg || !cfg.back_button_url) return '';
    const text = cfg.back_button_text || 'Back';
    return (
      '<div class="back-button-wrap">' +
        '<a class="back-button" href="' + escapeAttr(cfg.back_button_url) + '">' + escapeHTML(text) + '</a>' +
      '</div>'
    );
  }

  // Follow-links footer — mirrors the main site's "Follow Us Links"
  // card style (icon circle + name + description + arrow), editable
  // from the dashboard as a repeatable list.
  function followFooterHTML(cfg){
    const links = (cfg && Array.isArray(cfg.follow_links)) ? cfg.follow_links : [];
    if (!links.length) return '';

    let html = '<div class="follow-section"><h3>⚡ Follow For More</h3>';
    links.forEach(function(link){
      const platform = (link.platform || '').toLowerCase();
      const isX = platform === 'twitter' || platform === 'x';
      const icon = isX ? '𝕏' : '✈️';
      html +=
        '<a class="follow-card" href="' + escapeAttr(link.url || '#') + '">' +
          '<div class="follow-icon' + (isX ? ' x' : '') + '">' + icon + '</div>' +
          '<div class="follow-text">' +
            '<div class="name">' + escapeHTML(link.name || '') + '</div>' +
            '<div class="desc">' + escapeHTML(link.desc || '') + '</div>' +
          '</div>' +
          '<div class="follow-arrow">↗</div>' +
        '</a>';
    });
    html += '</div>';
    return html;
  }

  function renderNotAvailable(reason){
    document.getElementById('wrap').innerHTML =
      '<div class="state">' +
        '<h2>Not available yet</h2>' +
        '<p>' + reason + '</p>' +
      '</div>' +
      followFooterHTML(siteConfig);
  }

  function renderComic(data){
    const wrap = document.getElementById('wrap');
    const images = data.images || [];
    const title = data.title || 'Untitled';

    let html = '';

    // Title block — mirrors arccomic.github.io's own post structure:
    // title, a small stats row (rating/pages/NTR), then a grid of
    // labeled info cards (AUTHOR/CODE/CATEGORY/LANGUAGE/FULL COLOR/
    // NTR), then tag chips.
    html += '<div class="title-block">';
    html += '<h1>' + escapeHTML(title) + '</h1>';

    html += '<div class="stats-row">';
    if (data.rating) html += '<span class="rating-pill">⭐ ' + escapeHTML(String(data.rating)) + '</span>';
    if (images.length) html += '<span>' + images.length + ' pages</span>';
    if (data.is_ntr) html += '<span class="ntr-tag">NTR</span>';
    html += '</div>';

    html += '<div class="info-grid">';
    if (data.author) {
      html += '<div class="info-card"><div class="icon">✨</div><div><span class="label">Author</span><span class="value">' + escapeHTML(data.author) + '</span></div></div>';
    }
    if (data.code) {
      html += '<div class="info-card"><div class="icon">⭐</div><div><span class="label">Code</span><span class="value">' + escapeHTML(String(data.code)) + '</span></div></div>';
    }
    if (data.categories) {
      html += '<div class="info-card"><div class="icon">⚡</div><div><span class="label">Category</span><span class="value">' + escapeHTML(data.categories) + '</span></div></div>';
    }
    if (data.language) {
      html += '<div class="info-card"><div class="icon">🌐</div><div><span class="label">Language</span><span class="value">' + escapeHTML(String(data.language)) + '</span></div></div>';
    }
    if (data.full_color) {
      const isColor = String(data.full_color).toLowerCase() === 'yes';
      html += '<div class="info-card"><div class="icon">🎨</div><div><span class="label">Full Color</span><span class="value">' + (isColor ? 'Yes' : 'No') + '</span></div></div>';
    }
    html += '<div class="info-card"><div class="icon">🌙</div><div><span class="label">NTR</span><span class="value">' + (data.is_ntr ? 'Yes' : 'No') + '</span></div></div>';
    html += '</div>';

    if (Array.isArray(data.tags) && data.tags.length){
      html += '<div class="tags-row">';
      data.tags.forEach(function(tag){
        html += '<span class="tag-chip">' + escapeHTML(tag) + '</span>';
      });
      html += '</div>';
    }

    html += '</div>';

    // Ad right after title, before first page
    html += adSlotHTML();


    // Pages, with an ad slot every 9 pages
    images.forEach(function(src, i){
      const pageNum = i + 1;
      html += '<div class="page">';
      html += '<img src="' + escapeAttr(src) + '" loading="lazy" alt="Page ' + pageNum + '">';
      html += '<div class="page-num">' + pageNum + ' / ' + images.length + '</div>';
      html += '</div>';

      // After every 9th page (but not immediately duplicating the end-ad if it's also the last page)
      if (pageNum % 9 === 0 && pageNum !== images.length){
        html += adSlotHTML();
      }
    });

    // Final ad after the last page
    html += adSlotHTML();
    html += '<div class="end-note">End of comic</div>';

    // Back-to-channel button, then the follow-links footer — both
    // editable from the dashboard, both optional (skip cleanly if
    // site-config.json is missing/unconfigured).
    html += backButtonHTML(siteConfig);
    html += followFooterHTML(siteConfig);

    wrap.innerHTML = html;
    injectAdSlots();
  }

  function escapeHTML(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function escapeAttr(str){
    return String(str).replace(/"/g, '&quot;');
  }

  async function loadSiteConfig(){
    try{
      const res = await fetch('site-config.json', { cache: 'no-store' });
      if (res.ok) siteConfig = await res.json();
    } catch(err){
      // Branding is optional — a missing/unreachable site-config.json
      // should never block the comic itself from rendering.
      siteConfig = null;
    }
    renderHeader(siteConfig);
  }

  async function init(){
    await loadSiteConfig();

    const code = getCodeFromURL();
    if (!code){
      renderNotAvailable('No comic code was provided in the link.');
      return;
    }

    try{
      const res = await fetch('data/' + encodeURIComponent(code) + '.json', { cache: 'no-store' });
      if (!res.ok){
        renderNotAvailable('This comic isn\'t in our library yet. Check back later.');
        return;
      }
      const data = await res.json();
      if (!data || !Array.isArray(data.images) || data.images.length === 0){
        renderNotAvailable('This comic\'s pages couldn\'t be loaded.');
        return;
      }
      renderComic(data);
    } catch(err){
      renderNotAvailable('Something went wrong loading this comic. Please try again.');
    }
  }

  init();
})();
</script>

</body>
</html>
