<!DOCTYPE html>
<!-- READER_HTML_VERSION: 26 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reader</title>
<meta name="rating" content="adult">
<meta name="RTA" content="RTA-5042-1996-1400-1577-RTA">

<!-- Mondiad banner ad script -->
<!-- banner.js is loaded dynamically in JS, after ad divs exist —
     see injectAdSlots() — not statically here, to avoid a load-order
     race: as a static async tag, this script could run before
     renderComic() ever creates any .ad-slot-container elements,
     meaning it would find zero data-mndbanid elements on its one
     and only scan of the page. -->

<style>
  :root{
    --bg: #15161a;
    --bg-raised: #1d1f26;
    --line: #2a2d36;
    --text: #e8e8ec;
    --text-dim: #8b8d98;
    --accent: #ff5a7a;
    --brand-orange: #f59e0b;
    --tg-blue: #29a9eb;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 48px;
  }

  /* ---------- Title block ---------- */
  .title-block{
    padding: 20px 16px 24px;
    border-bottom: 1px solid var(--line);
  }
  .title-block h1{
    font-size: 1.5rem;
    line-height: 1.3;
    margin: 0 0 14px;
    font-weight: 800;
  }
  .stats-row{
    display:flex;
    align-items:center;
    gap: 10px 16px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .stats-row span{
    display:flex;
    align-items:center;
    gap: 4px;
  }
  .rating-pill{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background: rgba(245,158,11,0.15);
    color: var(--brand-orange);
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
  }
  .ntr-tag{
    display:inline-block;
    background: rgba(255,90,122,0.15);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 5px;
  }

  /* Info card grid — mirrors arccomic.github.io's AUTHOR/CODE/CATEGORY/
     LANGUAGE/FULL COLOR/NTR card layout exactly, two per row. */
  .info-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .info-card{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .info-card .icon{
    flex-shrink:0;
    width: 34px; height: 34px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1rem;
  }
  .info-card .label{
    display:block;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .info-card .value{
    display:block;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-decoration: none;
  }
  a.info-card, a.value, .info-card a.value{
    cursor: pointer;
  }
  .info-card a.value:active, .info-card a.value:hover{
    text-decoration: underline;
  }

  .tags-row{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .tag-chip{
    font-size: 0.72rem;
    color: var(--text-dim);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    padding: 3px 9px;
    border-radius: 20px;
    text-decoration: none;
    display: inline-block;
  }
  a.tag-chip:active, a.tag-chip:hover{
    color: var(--text);
    border-color: var(--text-dim);
  }

  /* ---------- Header ---------- */
  .site-header{
    display:flex;
    align-items:center;
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }
  .site-header a{
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color: var(--brand-orange);
    font-size: 1.15rem;
    font-weight: 700;
  }

  /* ---------- Back-to-channel button ---------- */
  .back-button-wrap{
    padding: 24px 16px 8px;
    text-align:center;
  }
  .back-button{
    display:inline-block;
    width:100%;
    max-width: 400px;
    padding: 14px 20px;
    background: var(--brand-orange);
    color: #15161a;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration:none;
    border-radius: 10px;
  }

  /* ---------- Footer follow-links ---------- */
  .follow-section{
    padding: 28px 16px 8px;
  }
  .follow-section h3{
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--brand-orange);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .follow-card{
    display:flex;
    align-items:center;
    gap: 12px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    text-decoration:none;
    color: var(--text);
  }
  .follow-icon{
    flex-shrink:0;
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--tg-blue);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1.1rem;
  }
  .follow-icon.x{ background:#000; border:1px solid var(--line); }
  .follow-text{ flex:1; min-width:0; }
  .follow-text .name{ font-weight:700; font-size:0.95rem; }
  .follow-text .desc{ font-size:0.8rem; color: var(--text-dim); margin-top:2px; }
  .follow-arrow{ color: var(--text-dim); font-size:1.1rem; flex-shrink:0; }


  /* Ad container sits with its own top/bottom margin, no label or
     divider line — ads are visually distinct on their own. */
  .ad-slot-container{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin: 22px 0;
  }

  /* ---------- Reading mode toggle ---------- */
  .mode-toggle-row{
    display:flex;
    gap: 10px;
    padding: 0 16px 18px;
  }
  .mode-toggle-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text-dim);
    font-weight: 700;
    font-size: 0.9rem;
    cursor:pointer;
  }
  .mode-toggle-btn.active{
    border-color: var(--brand-orange);
    color: var(--brand-orange);
    background: rgba(245,158,11,0.10);
  }

  /* ---------- Paginated mode ---------- */
  /* Normal document flow — NOT position:fixed. Ads sit before and
     after the page image and scroll naturally with the rest of the
     page, like a sandwich: ad -> image -> nav bar -> ad. */
  .paginated-wrap{
    display:flex;
    flex-direction:column;
    width:100%;
    max-width:720px;
    margin: 0 auto;
  }

  .paginated-stage{
    position: relative;
    width:100%;
  }
  .paginated-stage img{
    display:block;
    width:100%;
    height:auto;
    background: var(--bg-raised);
  }
  .tap-zone{
    position:absolute;
    top:0; bottom:0;
    width:50%;
    /* invisible — purely a hit target, no visual change on tap */
  }
  .tap-zone.left{ left:0; }
  .tap-zone.right{ right:0; }

  /* Nav bar — sits between the image and the bottom ad, nhentai-style:
     jump-to-first/last (double chevrons) + prev/next (single chevron)
     + page counter in the middle. */
  .paginated-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    padding: 14px 0;
  }
  .paginated-nav button{
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .paginated-nav button:disabled{
    opacity: 0.35;
    cursor: default;
  }
  .paginated-nav .pg-counter{
    padding: 0 10px;
    font-size: 0.85rem;
    color: var(--text-dim);
    white-space: nowrap;
  }


  /* ---------- Pages (scroll mode) ---------- */
  .page{
    display:block;
    width:100%;
    line-height:0; /* kill inline-img gap */
  }
  .page img{
    display:block;
    width:100%;
    height:auto;
    background: var(--bg-raised);
  }
  .page-num{
    text-align:center;
    font-size: 0.72rem;
    color: var(--text-dim);
    padding: 6px 0;
    background: var(--bg);
  }

  /* ---------- States ---------- */
  .state{
    padding: 60px 20px;
    text-align:center;
    color: var(--text-dim);
  }
  .state h2{
    color: var(--text);
    font-size: 1.1rem;
    margin: 0 0 8px;
  }
  .state p{
    font-size: 0.9rem;
    line-height: 1.5;
    max-width: 320px;
    margin: 0 auto;
  }
  .spinner{
    width: 26px; height: 26px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .end-note{
    text-align:center;
    padding: 28px 16px 4px;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  /* ---------- v26: skeleton, lazy page frames, ad-slot states ---------- */
  @keyframes sk-shimmer{
    0%{ background-position: 100% 0; }
    100%{ background-position: -100% 0; }
  }
  .sk, .ad-slot-container.ad-loading{
    background: linear-gradient(100deg, var(--bg-raised) 30%, #262a33 50%, var(--bg-raised) 70%);
    background-size: 200% 100%;
    animation: sk-shimmer 1.4s linear infinite;
  }
  .sk{ border-radius: 10px; }
  .sk-title-block{ padding: 20px 16px 24px; border-bottom: 1px solid var(--line); }
  .sk-h1{ height: 26px; width: 70%; margin-bottom: 14px; }
  .sk-line{ height: 14px; width: 45%; margin-bottom: 18px; }
  .sk-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sk-card{ height: 58px; }
  .sk-ad{ height: 90px; margin: 22px 16px; }
  .sk-page{ width:100%; aspect-ratio: 0.7; border-radius: 0; }

  /* Ad slots: hidden until their ad is actually requested (no empty
     gaps), shimmer while it loads, gap collapses if nothing fills. */
  .ad-slot-container.ad-pending{ display:none; }
  .ad-slot-container.ad-loading{ min-height: 90px; border-radius: 10px; }
  .ad-slot-container.ad-empty{ margin: 0; }

  /* Scroll-mode pages: a fixed-ratio skeleton frame until the image has
     loaded, then the real image takes over (fades in). */
  .page-frame{
    position: relative;
    width: 100%;
    background: var(--bg-raised);
    overflow: hidden;
  }
  .page-frame.loading{ aspect-ratio: var(--pg-ar, 0.7); }
  .page-frame.loading::after,
  .paginated-stage.pg-loading::after{
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.05) 50%, transparent 70%);
    background-size: 200% 100%;
    animation: sk-shimmer 1.3s linear infinite;
  }
  .page-frame img{ opacity: 0; transition: opacity .25s ease; }
  .page-frame.loaded img{ opacity: 1; }
  .page-frame.failed{
    aspect-ratio: var(--pg-ar, 0.7);
    display:flex; align-items:center; justify-content:center;
  }
  .pg-retry{
    line-height: 1.4;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.85rem;
  }

  /* Paginated: keep the stage the same size while the next page loads so
     the ads around it don't jump. */
  .paginated-stage.pg-loading{
    aspect-ratio: var(--pg-ar, 0.7);
    overflow: hidden;
    background: var(--bg-raised);
  }
  .paginated-stage.pg-loading img{ opacity: 0; }

  @media (prefers-reduced-motion: reduce){
    .sk, .ad-slot-container.ad-loading,
    .page-frame.loading::after, .paginated-stage.pg-loading::after{ animation: none; }
  }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="wrap" id="wrap">
  <!-- Skeleton: on screen the instant the HTML arrives, before any JS
       fetch finishes. renderComic() replaces it with the real page. -->
  <div id="loadingState" aria-hidden="true">
    <div class="sk-title-block">
      <div class="sk sk-h1"></div>
      <div class="sk sk-line"></div>
      <div class="sk-grid">
        <div class="sk sk-card"></div><div class="sk sk-card"></div>
        <div class="sk sk-card"></div><div class="sk sk-card"></div>
      </div>
    </div>
    <div class="sk sk-ad"></div>
    <div class="sk sk-page"></div>
  </div>
</div>

<script>
(function(){

  let siteConfig = null; // fetched once, reused for header + footer

  // Ad slot markup — each call gets its own placeholder container with
  // a unique id. The actual data-mndbanid div for each slot is created
  // fresh via JS afterward (see injectAdSlots), NOT baked into this
  // HTML string. Multiple identical static data-mndbanid elements
  // stamped into one page at once appears to be why every ad slot
  // returned zero fill — ad networks commonly only serve the first
  // instance of a given zone id per pageview and silently ignore
  // duplicates. This matches the fix that got ads working on the
  // sister site: inject a fresh div exactly when/where it's needed,
  // rather than pre-rendering several copies at once.
  // data-ad-slot on each container picks which Adsterra unit fills
  // it — "top" (title/paginated slots, dashboard-configurable
  // 300x250), "reading" (reading-page slots in scroll mode, fixed
  // 468x60, capped at MAX_READING_AD_SLOTS per comic), or "bottom"
  // (after the last page / paginated bottom, fixed 160x300). Mondiad
  // ignores this attribute entirely — it has only ever used one zone
  // ID regardless of placement.
  let _adSlotCounter = 0;
  // forceNetwork (optional): stamps a data-ad-network attribute on this
  // specific slot, used only by reading-slot rotation to pin a block to a
  // particular network regardless of the page's overall selected network.
  // Top/bottom callers never pass this, so those slots carry no such
  // attribute and fall through to the normal selected-network behavior.
  // opts.after (optional): the 1-based page this slot sits right after.
  // Slots start hidden ("ad-pending") and are only filled once that page
  // has loaded — see startScrollPipeline().
  function adSlotHTML(slotType, forceNetwork, opts){
    const slotId = 'ad-slot-' + (_adSlotCounter++);
    const netAttr = forceNetwork ? ' data-ad-network="' + forceNetwork + '"' : '';
    const afterAttr = (opts && opts.after) ? ' data-ad-after="' + opts.after + '"' : '';
    return '<div class="ad-slot-container ad-pending" id="' + slotId + '" data-ad-slot="' + slotType + '"' + netAttr + afterAttr + '></div>';
  }

  // Hard cap on reading-page ad slots per comic, regardless of page
  // count. Previously one slot was inserted every 9 pages with no
  // ceiling, so a 54-page comic could carry 5+ reading slots on top
  // of the top/bottom ones — Adsterra support (bot reply, ticket
  // #134522818, 2026-09-19) recommended keeping total ads on one
  // page around 4 max. With top + bottom fixed at 1 each, 3 is the
  // most reading slots that still respects that ceiling for any
  // comic length. Slots are spaced evenly through the comic (see
  // renderScroll) rather than at a fixed page interval, so a
  // short comic still gets fewer/no reading ads and a long one
  // never exceeds this count.
  const MAX_READING_AD_SLOTS = 3;  // Mondiad path only; Hilltop uses exactly 1 (see renderScroll)

  // Tap-link monetization (any network's direct link), scroll mode only — see
  // HANDOFF.md for the full compliance reasoning (ticket #134522818,
  // Daniel from Adsterra Publishers, 2026-09-20: same-user repeat
  // clicks across different days are fine as long as they're organic,
  // not bot/motivated/fraudulent traffic). Design constraints that
  // shaped this, all from Adil directly:
  //   - Paginated mode is deliberately excluded — tapping the image
  //     there already turns pages; hijacking that tap to navigate
  //     away would break the core reading interaction. Scroll mode's
  //     page taps do nothing today, so this is a genuinely new,
  //     non-conflicting behavior there.
  //   - Fires on the FIRST tap on any page image, once per comic
  //     (identified by its ?code=), once per calendar day — not more,
  //     regardless of how many times that comic is re-tapped that same
  //     day. Reading a *different* comic the same day fires again
  //     (independent key). Reading the *same* comic again tomorrow
  //     fires again (day resets it). This was Adil's own proposed
  //     design, chosen specifically to stay unambiguously inside
  //     "organic return traffic" — never a rate that could look
  //     scripted or forced.
  //   - Tags/artist links are explicitly excluded — comic page images
  //     only.
  //   - No auto-return after navigating to the smartlink — Adil's
  //     explicit call. The user taps back in Telegram's in-app
  //     WebView (confirmed single-tab, no multi-tab support) to
  //     resume reading. No countdown page, no return-URL plumbing.
  //   - Fully client-side (localStorage), no backend involved — fits
  //     the free-tier/GitHub-Pages-only hosting constraint Adil
  //     flagged; no server-side session storage exists to lean on.
  //   - Gated entirely behind siteConfig.smartlink_enabled, a
  //     dashboard kill switch defaulting to OFF. Checked fresh off
  //     site-config.json on every page load, so toggling it in the
  //     dashboard takes effect for every visitor on their very next
  //     load — no version bump or reader.html redeploy needed, same
  //     mechanism as the ad_network switch elsewhere in this file.
  function maybeFireSmartlink(){
    if (!siteConfig || !siteConfig.smartlink_enabled) return;
    const url = siteConfig.smartlink_url;
    if (!url) return; // enabled but no URL configured yet — no-op, not an error

    // Once per N HOURS per visitor (all comics share one timer) — N is
    // set from the dashboard (site_config.smartlink_hours), default 1 if
    // unset/invalid. Stored client-side only; if storage is unavailable we
    // fail safe by NOT firing rather than risk firing on every tap.
    const key = 'tapLink_lastFired';
    const hours = (siteConfig && Number(siteConfig.smartlink_hours) > 0)
      ? Number(siteConfig.smartlink_hours) : 1;
    const HOUR_MS = hours * 60 * 60 * 1000;
    const now = Date.now();

    try {
      const last = parseInt(window.localStorage.getItem(key) || '0', 10);
      if (last && (now - last) < HOUR_MS) return;
      window.localStorage.setItem(key, String(now));
    } catch (e) {
      return;
    }

    window.location.href = url;
  }

  // Ad network is chosen from the dashboard (site-config.json ->
  // ad_network: "mondiad" | "hilltop") and pushed through the
  // same pipeline as branding. Whichever network is NOT active gets zero
  // script tags, zero divs, zero network calls — no leftover/dead
  // fill attempts from the inactive network.
  //
  // forceNetwork (optional): overrides the network for every container
  // passed in, ignoring any per-container data-ad-network attribute. Used
  // by paginated mode's top/bottom refresh (those two slots are always a
  // single network at once, never split) — reading-slot rotation in
  // scroll mode instead relies on each container's own data-ad-network
  // attribute (see below), since a single injectAdSlots() call there
  // covers many slots that may each belong to a different network.
  //
  // Without forceNetwork, containers are grouped by their own
  // data-ad-network attribute (set by adSlotHTML for rotated reading
  // slots) with any container lacking that attribute (top, bottom, and
  // every reading slot when rotation is off) falling back to the
  // dashboard-selected siteConfig.ad_network — exactly the original
  // single-network behavior, unchanged, for every case rotation doesn't
  // touch.
  // The dashboard-selected "Active Network". Only two are real choices
  // (native is rotation-only, ClickAdilla is gone). Anything else — e.g.
  // a stale "clickadilla" from an old saved config — counts as Mondiad,
  // so no code path ever carries a network name nothing handles.
  function activeNetwork(){
    return (siteConfig && siteConfig.ad_network === 'hilltop') ? 'hilltop' : 'mondiad';
  }

  // ---------- Ad engine ----------
  //
  // Why ads used to go blank after a reading-mode switch, after ~5
  // paginated page turns, and far down long comics: Mondiad's banner.js /
  // native.js scan the page for their marker divs ONCE, at the moment the
  // script loads. The old code loaded each script a single time, then kept
  // creating new divs (every mode switch, every paginated refresh, every
  // reading slot at once at page load) — divs the script never looked at,
  // so nothing filled.
  //
  // Rules that fix it for every network:
  //   1. One injection = one fresh marker div + one fresh load of the
  //      network's script AFTER that div exists (the only pattern ever
  //      confirmed working live on this site).
  //   2. Injections for the same network run ONE AT A TIME, so a script
  //      never scans two unfilled divs of the same zone at once (networks
  //      may only fill the first instance per scan).
  //   3. Slots that already hold an ad are "retired" before a re-scan, so
  //      a later script load can't stack a second ad into an old slot.
  //   4. Ads are requested only when their block of pages has loaded (see
  //      startScrollPipeline / renderPaginated) — never all at page load.

  const MONDIAD_ZONE_ID = '79d7aa12-5511-404b-89a3-dbeb4ae4b292';
  const AD_FILL_TIMEOUT_MS = 4000;  // an empty slot counts as "no fill" after this long
  const AD_GAP_MS = 300;            // pause between two injections of the same network

  let _renderToken = 0;             // bumped on every (re)render; stale async work checks it
  let _cleanups = [];               // observers etc. dropped when the reading area re-renders
  const _adQueues = {};             // network -> { busy, items[] }

  function beginRender(){
    _renderToken++;
    _cleanups.forEach(function(fn){ try { fn(); } catch (e) {} });
    _cleanups = [];
    Object.keys(_adQueues).forEach(function(k){ _adQueues[k].items = []; });
  }

  // True once anything other than our own marker divs / scripts is inside
  // the slot — i.e. the network actually put an ad there.
  function slotHasAd(container){
    const all = container.querySelectorAll('*');
    for (let i = 0; i < all.length; i++){
      const el = all[i];
      const tag = el.tagName;
      if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'LINK') continue;
      if (el.hasAttribute('data-mndbanid') || el.hasAttribute('data-mndazid') || el.hasAttribute('data-ad-done')) continue;
      return true;
    }
    return false;
  }

  // Shimmer while waiting; collapse the gap if nothing fills; flip back to
  // normal the moment an ad does appear (even late — e.g. a network that
  // only renders once the slot scrolls into view).
  function watchSlot(container, timeoutMs, onSettled){
    container.classList.remove('ad-pending', 'ad-empty');
    container.classList.add('ad-loading');
    let settled = false;
    let observer = null;
    function settle(){ if (!settled){ settled = true; if (onSettled) onSettled(); } }
    function filled(){
      container.classList.remove('ad-loading', 'ad-empty');
      container.style.minHeight = '';
      if (observer) observer.disconnect();
      settle();
    }
    if (slotHasAd(container)) { filled(); return; }
    if ('MutationObserver' in window) {
      observer = new MutationObserver(function(){ if (slotHasAd(container)) filled(); });
      observer.observe(container, { childList: true, subtree: true });
    }
    setTimeout(function(){
      if (slotHasAd(container)) { filled(); return; }
      container.classList.remove('ad-loading');
      container.classList.add('ad-empty');
      container.style.minHeight = '';
      settle();
    }, timeoutMs);
  }

  // Marker divs whose slot already shows an ad are switched off so the
  // next script load skips them (see rule 3).
  function retireFilledDivs(attr){
    document.querySelectorAll('[' + attr + ']').forEach(function(d){
      const slot = d.closest('.ad-slot-container');
      if (slot && slotHasAd(slot)) {
        d.setAttribute('data-ad-done', d.getAttribute(attr));
        d.removeAttribute(attr);
      }
    });
  }

  function reloadAdScript(key, srcUrl){
    document.querySelectorAll('script[data-ad-loader="' + key + '"]').forEach(function(old){
      if (old.parentNode) old.parentNode.removeChild(old);
    });
    const s = document.createElement('script');
    s.async = true;
    s.src = srcUrl;
    s.setAttribute('data-ad-loader', key);
    document.head.appendChild(s);
  }

  // Puts ONE ad into ONE slot. done(gapMs) tells the queue when the next
  // injection for this network may start.
  function injectOne(network, container, done){
    if (network === 'hilltop') {
      // Hilltop appends its own script inside the slot (one zone per slot,
      // never reused), so nothing to serialise or re-scan.
      injectHilltopSlots([container]);
      watchSlot(container, AD_FILL_TIMEOUT_MS * 2, null);
      done(0);
      return;
    }
    const isNative = (network === 'native');
    const attr = isNative ? 'data-mndazid' : 'data-mndbanid';
    retireFilledDivs(attr);
    const div = document.createElement('div');
    div.setAttribute(attr, isNative ? nativeZoneId() : MONDIAD_ZONE_ID);
    container.appendChild(div);
    reloadAdScript(isNative ? 'native' : 'mondiad',
                   isNative ? 'https://ss.mrmnd.com/native.js' : 'https://ss.mrmnd.com/banner.js');
    watchSlot(container, AD_FILL_TIMEOUT_MS, function(){ done(AD_GAP_MS); });
  }

  function queueAdInjection(network, container){
    const q = _adQueues[network] || (_adQueues[network] = { busy: false, items: [] });
    q.items.push({ container: container, token: _renderToken });
    drainAdQueue(network);
  }

  function drainAdQueue(network){
    const q = _adQueues[network];
    if (!q || q.busy) return;
    const item = q.items.shift();
    if (!item) return;
    // Dropped if the reading area was re-rendered (mode switch) since queued.
    if (item.token !== _renderToken || !item.container.isConnected) { drainAdQueue(network); return; }
    q.busy = true;
    let finished = false;
    function release(gapMs){
      if (finished) return;
      finished = true;
      setTimeout(function(){ q.busy = false; drainAdQueue(network); }, gapMs);
    }
    try {
      injectOne(network, item.container, release);
    } catch (err) {
      release(0);
    }
  }

  // Entry point used everywhere. Each container is queued on its own —
  // never batched — so every ad is its own fresh request.
  //
  // forceNetwork (optional): overrides the network for every container
  // passed in. Used by paginated mode's top/bottom slots. Otherwise each
  // container uses its own data-ad-network attribute (rotated reading
  // slots) and falls back to the dashboard-selected Active Network.
  function injectAdSlots(containers, forceNetwork){
    containers = containers || document.querySelectorAll('.ad-slot-container');
    const defaultNetwork = activeNetwork();
    Array.prototype.forEach.call(containers, function(c){
      let net = forceNetwork || c.getAttribute('data-ad-network') || defaultNetwork;
      // Only three names are real; anything stale falls back to Mondiad.
      if (net !== 'hilltop' && net !== 'native') net = 'mondiad';
      queueAdInjection(net, c);
    });
  }

  // Re-requests a fresh ad into slots that already have one (paginated
  // mode's periodic refresh). The slot keeps its current height while the
  // new ad loads, so the page doesn't jump.
  function refreshAdSlots(containers, forceNetwork){
    Array.prototype.forEach.call(containers, function(c){
      const h = c.offsetHeight;
      if (h) c.style.minHeight = h + 'px';
      c.innerHTML = '';
      c.classList.remove('ad-empty');
    });
    injectAdSlots(containers, forceNetwork);
  }

  // ---------- Multi-network reading-slot rotation ----------
  //
  // OFF by default (site-config.json's "multi_network_rotation_enabled").
  // When off, every code path below is a no-op and behavior is byte-for-byte
  // what it was before this feature existed: top/bottom + reading slots all
  // come from the single dashboard-selected ad_network, exactly as today.
  //
  // When ON: top and bottom are STILL untouched — always the selected
  // network, same as always. Only the in-content reading slots rotate.
  // Reading content is split into blocks (one 9-page group in scroll mode,
  // one 5-page-turn group in paginated mode — each mode's own existing
  // cadence, unchanged). Block 1 always goes to the dashboard-selected
  // network (priority doesn't override the operator's active pick — it
  // only decides who comes AFTER). Block 2 goes to whichever OTHER network
  // has the lowest priority number, block 3 the next, cycling back to the
  // selected network once every configured network has had one block.
  //
  // Priority numbers come from site-config.json's "network_priority"
  // object, e.g. {"mondiad": 3, "hilltop": 2, "native": 1} — lower
  // fills sooner. A network missing from that object, or with a
  // non-numeric value, sorts last (but is still included in rotation).
  function rotationEnabled(){
    // Native's own checkbox also switches the rotation machinery on: the
    // native ad only ever appears through this block/cycle sequence, so
    // ticking "Enable Native Ads" must be enough by itself — it must not
    // silently do nothing unless the general rotation box is ticked too.
    return !!(siteConfig && (siteConfig.multi_network_rotation_enabled || siteConfig.native_ads_enabled));
  }

  // Ordered list of networks for the handoff sequence, AFTER the selected
  // one. e.g. selected = mondiad, priorities hilltop:2, native:1
  // -> returns ['hilltop', 'mondiad'] (hilltop's 2 beats mondiad's 3).
  function rotationHandoffOrder(){
    // 'native' only joins the rotation when its dashboard checkbox is on.
    // When off it is absent from this list entirely, so it can never own
    // a block and no native.js is ever requested.
    const ALL = ['mondiad', 'hilltop'];
    if (siteConfig && siteConfig.native_ads_enabled) ALL.push('native');
    const selected = activeNetwork();
    const priorities = (siteConfig && siteConfig.network_priority) || {};
    const rest = ALL.filter(function(n){ return n !== selected; });
    rest.sort(function(a, b){
      const pa = Number(priorities[a]);
      const pb = Number(priorities[b]);
      const va = isFinite(pa) ? pa : 999;
      const vb = isFinite(pb) ? pb : 999;
      return va - vb;
    });
    return rest;
  }

  // Full block-ownership sequence: the selected network normally gets the
  // first TWO blocks, then every other network gets exactly one block
  // each, in priority order, then the whole sequence repeats. e.g.
  // selected = mondiad, priorities hilltop:2 native:1 ->
  // [mondiad, mondiad, native, hilltop], repeating. This (not a
  // flat 1-each round robin) is Adil's explicit spec — the selected/
  // active network is meant to still dominate, priority only governs who
  // fills in behind it.
  //
  // EXCEPTION: Hilltop only ever gets ONE slot in this sequence, even
  // when it's the selected network. Hilltop has exactly one "reading"
  // zone URL (see HILLTOP_DEFAULTS) — giving it two blocks on the same
  // page means the second block reuses that same zone code, which
  // Hilltop simply returns blank fill for (their own "never reused
  // across two slots" rule, same reasoning as this file's original
  // pre-rotation Hilltop handling). Confirmed live by Adil: a blank slot
  // costs real revenue and looks broken to readers, so Hilltop hands off
  // to the next-priority network immediately after its one slot rather
  // than holding a second slot it can't actually fill. Every other
  // network is unaffected — they still get their full two blocks when
  // selected, since Mondiad's scripts re-scan for banner
  // divs and don't have this one-zone-per-page restriction.
  function rotationBlockSequence(){
    const selected = activeNetwork();
    const selectedBlocks = (selected === 'hilltop') ? [selected] : [selected, selected];
    return selectedBlocks.concat(rotationHandoffOrder());
  }

  // blockIndex is 0-based (0 = first reading-slot block encountered).
  // Returns which network owns that block per rotationBlockSequence()
  // above, cycling once the sequence is exhausted.
  function networkForBlock(blockIndex){
    if (!rotationEnabled()) {
      return activeNetwork();
    }
    const seq = rotationBlockSequence();
    return seq[blockIndex % seq.length];
  }

  // Paginated mode has no separate reading slot — just top+bottom,
  // refreshed together every PAGINATED_AD_REFRESH_EVERY turns. Per Adil:
  // within the SAME refresh cycle, top and bottom deliberately pull from
  // TWO DIFFERENT networks at once (not the same one), and both slots'
  // pointers independently advance one step through the SAME block
  // sequence used by scroll mode's reading slots (selected network first
  // for two cycles, then each other network for one cycle, repeating).
  // slotOffset is 0 for top, 1 for bottom — bottom always starts one
  // position further into the sequence than top, so as long as 2+
  // networks are in play they never coincide.
  function networkForCycle(cycleIndex, slotOffset){
    if (!rotationEnabled()) {
      return activeNetwork();
    }
    const seq = rotationBlockSequence();
    return seq[(cycleIndex + slotOffset) % seq.length];
  }

  // (Mondiad banners are injected by the ad engine above — see injectOne.)

  // Hilltop MultiTag banners — one zone per placement, never reused
  // across two slots. Each zone's script inserts its banner right
  // before its own <script> tag, so every script is appended INSIDE
  // its slot container. Zone paths are the ones generated by the
  // Hilltop dashboard (zone "Arc Reading page"); they can be
  // overridden from the dashboard via site-config.json.
  //   "top"     — title slot (scroll) / top of stage (paginated)
  //   "reading" — the single in-comic slot after page 9 (scroll mode)
  //   "bottom"  — after the last page (scroll) / below the nav (paginated)
  const HILLTOP_DEFAULTS = {
    top:     '//juvenilechoice.com/bYX-V.sEdgGxlk0bYmWAcZ/remmp9QuoZdUClnkCPwTbcKy_M_D/AQzJO/DyU/t/N/zqIOwPMrD/MW4HOaQe',
    reading: '//juvenilechoice.com/bCXaVhsGd.G/lJ0-YTWkct/heKmy9EuyZ/UDlQksPnTlcDyYMCDrA/zINejWkGt/N/zjIVw/MgD/MB3DMdwR',
    bottom:  '//juvenilechoice.com/b.XxVUsFdBGclq0/YcWUcT/ue/mG9Iu_ZaUulzkDPsTEcDxIOgTYYf1aNVjxkmt/N/zxEz5TNPjdUU3VMFwQ'
  };

  function hilltopSrc(slotType){
    const t = (slotType === 'reading' || slotType === 'bottom') ? slotType : 'top';
    const override = siteConfig && siteConfig['hilltop_' + t + '_src'];
    return override || HILLTOP_DEFAULTS[t];
  }

  function injectHilltopSlots(containers){
    Array.prototype.forEach.call(containers, function(container){
      // A slot that already holds a Hilltop script is never filled twice.
      if (container.getAttribute('data-hilltop-loaded') === '1') return;
      container.setAttribute('data-hilltop-loaded', '1');

      const script = document.createElement('script');
      script.async = true;
      script.referrerPolicy = 'no-referrer-when-downgrade';
      script.src = hilltopSrc(container.getAttribute('data-ad-slot'));
      container.appendChild(script);
    });
  }

  // Mondiad NATIVE ads — replaces ClickAdilla's seat in the reading-slot
  // rotation (ClickAdilla removed entirely: it never paid publishers).
  // Different script and attribute from Mondiad's banners:
  //   banner ads -> ss.mrmnd.com/banner.js  + <div data-mndbanid="...">
  //   native ads -> ss.mrmnd.com/native.js  + <div data-mndazid="...">
  // Native is NEVER a dashboard "Active Network" choice — it is a
  // rotation-only network, switched on/off by a checkbox on the dashboard
  // (site-config.json -> native_ads_enabled). When that checkbox is off,
  // 'native' is simply absent from the rotation list, so no native
  // script, div or network call is ever made.
  //
  // native.js may scan the page for its divs only ONCE at load time (the
  // same trap ClickAdilla's adManager.js fell into, see HANDOFF section
  // 5g), and this reader creates fresh native divs later (mode switch,
  // paginated refresh). So every time new native divs are injected, any
  // previous native.js tag is removed and a fresh one is loaded AFTER the
  // divs exist — the same fix that solved ClickAdilla's re-render bug.
  const NATIVE_ZONE_ID = '46474a49-ec2d-4f56-b270-26751ac9202a';

  function nativeZoneId(){
    const override = siteConfig && siteConfig.native_zone_id;
    return override ? String(override) : NATIVE_ZONE_ID;
  }

  // (Native ads are injected by the ad engine above — see injectOne.)

  function getCodeFromURL(){
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    return code ? code.trim() : null;
  }

  // Header logo — editable from the dashboard (text + link). Renders
  // even while the comic itself is loading/erroring, so it always
  // sits above whatever state is currently in #wrap.
  function renderHeader(cfg){
    const el = document.getElementById('siteHeader');
    if (!cfg || !cfg.header_logo_text){
      el.innerHTML = '';
      return;
    }
    const url = cfg.header_logo_url || '#';
    el.innerHTML =
      '<div class="site-header">' +
        '<a href="' + escapeAttr(url) + '">' + escapeHTML(cfg.header_logo_text) + '</a>' +
      '</div>';
  }

  function backButtonHTML(cfg){
    if (!cfg || !cfg.back_button_url) return '';
    const text = cfg.back_button_text || 'Back';
    return (
      '<div class="back-button-wrap">' +
        '<a class="back-button" href="' + escapeAttr(cfg.back_button_url) + '">' + escapeHTML(text) + '</a>' +
      '</div>'
    );
  }

  // Follow-links footer — mirrors the main site's "Follow Us Links"
  // card style (icon circle + name + description + arrow), editable
  // from the dashboard as a repeatable list.
  function followFooterHTML(cfg){
    const links = (cfg && Array.isArray(cfg.follow_links)) ? cfg.follow_links : [];
    if (!links.length) return '';

    let html = '<div class="follow-section"><h3>⚡ Follow For More</h3>';
    links.forEach(function(link){
      const platform = (link.platform || '').toLowerCase();
      const isX = platform === 'twitter' || platform === 'x';
      const icon = isX ? '𝕏' : '✈️';
      html +=
        '<a class="follow-card" href="' + escapeAttr(link.url || '#') + '">' +
          '<div class="follow-icon' + (isX ? ' x' : '') + '">' + icon + '</div>' +
          '<div class="follow-text">' +
            '<div class="name">' + escapeHTML(link.name || '') + '</div>' +
            '<div class="desc">' + escapeHTML(link.desc || '') + '</div>' +
          '</div>' +
          '<div class="follow-arrow">↗</div>' +
        '</a>';
    });
    html += '</div>';
    return html;
  }

  function renderNotAvailable(reason){
    document.getElementById('wrap').innerHTML =
      '<div class="state">' +
        '<h2>Not available yet</h2>' +
        '<p>' + reason + '</p>' +
      '</div>' +
      followFooterHTML(siteConfig);
  }

  function renderComic(data){
    const wrap = document.getElementById('wrap');
    const images = data.images || [];
    const title = data.title || 'Untitled';

    let html = '';

    // Title block — mirrors arccomic.github.io's own post structure:
    // title, a small stats row (rating/pages/NTR), then a grid of
    // labeled info cards (AUTHOR/CODE/CATEGORY/LANGUAGE/FULL COLOR/
    // NTR), then tag chips.
    html += '<div class="title-block">';
    html += '<h1>' + escapeHTML(title) + '</h1>';

    html += '<div class="stats-row">';
    if (data.rating) html += '<span class="rating-pill">⭐ ' + escapeHTML(String(data.rating)) + '</span>';
    if (images.length) html += '<span>' + images.length + ' pages</span>';
    if (data.is_ntr) html += '<span class="ntr-tag">NTR</span>';
    html += '</div>';

    html += '<div class="info-grid">';
    if (data.author) {
      const artistSlug = slugify(data.author);
      const artistHref = 'https://arccomic.github.io/artists/' + escapeAttr(artistSlug) + '/';
      html += '<div class="info-card"><div class="icon">✨</div><div><span class="label">Author</span><a class="value" href="' + artistHref + '">' + escapeHTML(data.author) + '</a></div></div>';
    }
    if (data.code) {
      html += '<div class="info-card"><div class="icon">⭐</div><div><span class="label">Code</span><span class="value">' + escapeHTML(String(data.code)) + '</span></div></div>';
    }
    if (data.categories) {
      html += '<div class="info-card"><div class="icon">⚡</div><div><span class="label">Category</span><span class="value">' + escapeHTML(data.categories) + '</span></div></div>';
    }
    if (data.language) {
      html += '<div class="info-card"><div class="icon">🌐</div><div><span class="label">Language</span><span class="value">' + escapeHTML(String(data.language)) + '</span></div></div>';
    }
    if (data.full_color) {
      const isColor = String(data.full_color).toLowerCase() === 'yes';
      html += '<div class="info-card"><div class="icon">🎨</div><div><span class="label">Full Color</span><span class="value">' + (isColor ? 'Yes' : 'No') + '</span></div></div>';
    }
    html += '<div class="info-card"><div class="icon">🌙</div><div><span class="label">NTR</span><span class="value">' + (data.is_ntr ? 'Yes' : 'No') + '</span></div></div>';
    html += '</div>';

    if (Array.isArray(data.tags) && data.tags.length){
      html += '<div class="tags-row">';
      data.tags.forEach(function(tag){
        const tagSlug = slugify(tag);
        const tagHref = 'https://arccomic.github.io/tags/' + escapeAttr(tagSlug) + '/';
        html += '<a class="tag-chip" href="' + tagHref + '">' + escapeHTML(tag) + '</a>';
      });
      html += '</div>';
    }

    html += '</div>';

    // Reading-mode toggle — two buttons, side by side, right after
    // tags/info and before any pages/ads. Persisted in localStorage
    // so it's remembered site-wide on the next comic too. Gated
    // server-side by site-config.json's paginated_mode_enabled — a
    // dashboard kill switch. When disabled, these buttons never even
    // render, so every visitor gets Scroll mode regardless of
    // whatever they may have saved in localStorage from an earlier
    // session while testing was on.
    if (siteConfig && siteConfig.paginated_mode_enabled) {
      html += '<div class="mode-toggle-row" id="modeToggleRow">' +
        '<button class="mode-toggle-btn" id="modeBtnScroll">📜 Scroll</button>' +
        '<button class="mode-toggle-btn" id="modeBtnPaginated">📖 Paginated</button>' +
      '</div>';
    }

    // Everything mode-dependent (ad slots + page images) lives inside
    // #pagesArea so switching modes only re-renders this one section —
    // header, title block, tags, back button, and footer never move.
    html += '<div id="pagesArea"></div>';

    // Back-to-channel button, then the follow-links footer — both
    // editable from the dashboard, both optional (skip cleanly if
    // site-config.json is missing/unconfigured). These sit AFTER
    // pagesArea in the DOM always, regardless of reading mode.
    html += backButtonHTML(siteConfig);
    html += followFooterHTML(siteConfig);

    wrap.innerHTML = html;

    _currentImages = images;
    initModeToggle();
    renderPagesArea(images);
  }

  // ---------- Reading mode: state + toggle ----------

  let _currentImages = [];
  const READING_MODE_KEY = 'readingMode'; // localStorage key, site-wide

  // Server-side kill switch wins over any client-saved preference.
  // If the dashboard has paginated mode disabled, this always
  // returns 'scroll' — a leftover localStorage value from an earlier
  // test period is never honored while the switch is off.
  function getReadingMode(){
    if (!siteConfig || !siteConfig.paginated_mode_enabled) return 'scroll';
    const saved = localStorage.getItem(READING_MODE_KEY);
    return (saved === 'paginated') ? 'paginated' : 'scroll'; // scroll is the default
  }
  function setReadingMode(mode){
    localStorage.setItem(READING_MODE_KEY, mode);
  }

  function initModeToggle(){
    const scrollBtn = document.getElementById('modeBtnScroll');
    const pagBtn = document.getElementById('modeBtnPaginated');
    if (!scrollBtn || !pagBtn) return; // buttons don't exist while the kill switch is off

    function paint(){
      const mode = getReadingMode();
      scrollBtn.classList.toggle('active', mode === 'scroll');
      pagBtn.classList.toggle('active', mode === 'paginated');
    }
    paint();

    scrollBtn.addEventListener('click', function(){
      if (getReadingMode() === 'scroll') return;
      setReadingMode('scroll');
      paint();
      renderPagesArea(_currentImages);
    });
    pagBtn.addEventListener('click', function(){
      if (getReadingMode() === 'paginated') return;
      setReadingMode('paginated');
      paint();
      renderPagesArea(_currentImages);
    });
  }

  // Renders whichever mode is currently active into #pagesArea.
  // Called on first load and every time the toggle is tapped.
  function renderPagesArea(images){
    const mode = getReadingMode();
    if (mode === 'paginated') {
      renderPaginated(images);
    } else {
      renderScroll(images);
    }
  }

  // ---------- Scroll mode (original behavior, unchanged) ----------

  function renderScroll(images){
    const area = document.getElementById('pagesArea');
    if (!area) return;

    beginRender();                 // drops the previous mode's observers + queued ads
    const token = _renderToken;

    let html = '';

    // Ad right after title, before first page — top slot (300x250)
    html += adSlotHTML('top', null, { pending: true });

    // Reading-page ad slots: placed every 9th page (9, 18, 27...), capped
    // at MAX_READING_AD_SLOTS total regardless of page count. A short
    // comic (fewer than 9 pages, or fewer 9-multiples than the cap) gets
    // fewer slots, never more than the cap. Never places a slot on the
    // very last page — that's the dedicated "bottom" slot's job.
    // Hilltop's MultiTag scripts are single-load-per-zone, so it's stuck
    // with exactly one reading slot. Mondiad/native have no such per-zone reuse
    // restriction (same as Mondiad — its script just re-scans for banner
    // divs), so it also gets the every-9-pages cadence, just capped higher.
    const _net = activeNetwork();
    const _rotation = rotationEnabled();

    // Reading-slot pages -> which network owns that block. Without
    // rotation this is exactly the old logic (Hilltop gets one slot at
    // page 9, everyone else gets up to MAX_READING_AD_SLOTS every 9
    // pages) — byte-for-byte the same outcome as before this feature
    // existed. With rotation on, each 9-page block can be owned by a
    // DIFFERENT network per networkForBlock(), and Hilltop's structural
    // one-slot-only limit applies only to the block(s) where Hilltop is
    // the block owner, not to the comic as a whole — a later block owned
    // by Mondiad/native is unaffected by Hilltop having already used
    // its one slot earlier.
    const readingSlotPages = new Map(); // pageNum -> network for that slot
    if (_rotation) {
      let blockIndex = 0;
      for (let p = 9; p < images.length; p += 9) {
        const owner = networkForBlock(blockIndex);
        readingSlotPages.set(p, owner);
        blockIndex++;
        // No cap here: rotation spreads load across networks, so the old
        // single-network MAX_READING_AD_SLOTS ceiling (there to protect
        // one network's page-density policy) doesn't apply the same way.
        // A very long comic still gets a slot every 9 pages, just handed
        // to a different network each block.
      }
    } else if (_net === 'hilltop') {
      if (images.length > 9) readingSlotPages.set(9, 'hilltop');
    } else {
      let count = 0;
      for (let p = 9; p < images.length && count < MAX_READING_AD_SLOTS; p += 9) {
        readingSlotPages.set(p, _net || 'mondiad');
        count++;
      }
    }

    images.forEach(function(src, i){
      const pageNum = i + 1;
      html += '<div class="page">';
      // Skeleton frame first. The real <img> only gets its src when the
      // pipeline reaches it (see startScrollPipeline) — no native
      // loading="lazy", so load ORDER is ours and ads can follow blocks.
      html += '<div class="page-frame loading" data-idx="' + i + '">' +
                '<img data-src="' + escapeAttr(src) + '" alt="" decoding="async">' +
              '</div>';
      html += '<div class="page-num">' + pageNum + ' / ' + images.length + '</div>';
      html += '</div>';

      if (readingSlotPages.has(pageNum) && pageNum !== images.length){
        html += adSlotHTML('reading', readingSlotPages.get(pageNum), { after: pageNum });
      }
    });

    // Final ad after the last page — bottom slot (160x300)
    html += adSlotHTML('bottom', null, { after: images.length });
    html += '<div class="end-note">End of comic</div>';

    area.innerHTML = html;

    // Smartlink: one listener per page image, all sharing the same
    // maybeFireSmartlink() gate (unchanged behavior).
    area.querySelectorAll('.page img').forEach(function(img){
      img.addEventListener('click', maybeFireSmartlink);
    });

    startScrollPipeline(area, token);
  }

  // First loaded page's shape becomes the skeleton shape for every page
  // still waiting, so the layout barely moves as images arrive.
  function adoptRatio(area, img){
    if (area.getAttribute('data-ar-set')) return;
    if (!img.naturalWidth || !img.naturalHeight) return;
    area.style.setProperty('--pg-ar', (img.naturalWidth / img.naturalHeight).toFixed(4));
    area.setAttribute('data-ar-set', '1');
  }

  // Scroll-mode loading order:
  //   skeleton -> top ad request -> page 1 -> page 2 -> ...
  // Pages load in order, two at a time, only as far as a little past the
  // viewport (jump far down and it loads around you, not everything above).
  // Each ad slot is requested when the page right before it has loaded —
  // i.e. when its block of 9 pages is in — never all at once at page load.
  function startScrollPipeline(area, token){
    const frames = Array.prototype.slice.call(area.querySelectorAll('.page-frame'));
    const total = frames.length;
    const state = [];                 // per page: 0 idle, 1 loading, 2 finished, 3 waiting to retry
    const tries = [];
    for (let k = 0; k < total; k++) { state.push(0); tries.push(0); }
    const near = {};                  // index -> true while its frame is close to the viewport
    let inflight = 0;
    const CONCURRENCY = 2;            // pages downloading at once
    const AHEAD = 2;                  // pages fetched beyond the last near one
    const slotAfter = {};             // page number -> ad slot sitting right after it
    Array.prototype.forEach.call(area.querySelectorAll('.ad-slot-container[data-ad-after]'), function(c){
      slotAfter[c.getAttribute('data-ad-after')] = c;
    });

    function alive(){ return token === _renderToken; }

    function startSlot(slot){
      if (!slot || slot.getAttribute('data-ad-started')) return;
      slot.setAttribute('data-ad-started', '1');
      injectAdSlots([slot]);
    }

    function finishPage(i){
      state[i] = 2;
      startSlot(slotAfter[i + 1]);    // block complete -> its ad goes now
    }

    function failPage(i){
      const frame = frames[i];
      frame.classList.remove('loading');
      frame.classList.add('failed');
      const btn = document.createElement('button');
      btn.className = 'pg-retry';
      btn.textContent = 'Page ' + (i + 1) + ' didn\'t load — tap to retry';
      btn.addEventListener('click', function(){
        if (btn.parentNode) btn.parentNode.removeChild(btn);
        frame.classList.remove('failed');
        frame.classList.add('loading');
        tries[i] = 0;
        state[i] = 0;
        pump();
      });
      frame.appendChild(btn);
      finishPage(i);                  // a broken page must not hold its block's ad back
    }

    function loadPage(i){
      const frame = frames[i];
      const img = frame.querySelector('img');
      state[i] = 1;
      inflight++;
      img.onload = function(){
        img.onload = img.onerror = null;
        inflight--;
        if (!alive()) return;
        img.alt = 'Page ' + (i + 1);
        frame.classList.remove('loading', 'failed');
        frame.classList.add('loaded');
        adoptRatio(area, img);
        finishPage(i);
        pump();
      };
      img.onerror = function(){
        img.onload = img.onerror = null;
        inflight--;
        if (!alive()) return;
        tries[i]++;
        if (tries[i] <= 2) {
          state[i] = 3;
          setTimeout(function(){
            if (!alive()) return;
            state[i] = 0;
            pump();
          }, 900 * tries[i]);
        } else {
          failPage(i);
        }
        pump();
      };
      if (i === 0) img.setAttribute('fetchpriority', 'high');
      img.removeAttribute('src');     // makes a retry re-request instead of being ignored
      img.src = img.getAttribute('data-src');
    }

    function pump(){
      if (!alive()) return;
      let lo = -1, hi = -1;
      Object.keys(near).forEach(function(k){
        const n = +k;
        if (lo < 0 || n < lo) lo = n;
        if (n > hi) hi = n;
      });
      if (lo < 0) { lo = 0; hi = 0; }   // nothing measured yet -> start at page 1
      const from = Math.max(0, lo - 1);
      const to = Math.min(total - 1, hi + AHEAD);
      for (let i = from; i <= to && inflight < CONCURRENCY; i++){
        if (state[i] === 0) loadPage(i);
      }
    }

    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          const i = +e.target.getAttribute('data-idx');
          if (e.isIntersecting) near[i] = true; else delete near[i];
        });
        pump();
      }, { rootMargin: '700px 0px 1200px 0px' });
      frames.forEach(function(f){ io.observe(f); });
      _cleanups.push(function(){ io.disconnect(); });
    } else {
      // Very old browser without viewport tracking: load everything, in order.
      for (let k = 0; k < total; k++) near[k] = true;
    }

    // 1) the top ad request goes out first ...
    const topSlot = area.querySelector('.ad-slot-container[data-ad-slot="top"]');
    if (topSlot) startSlot(topSlot);
    // 2) ... then page 1, page 2, ...
    pump();
  }

  // ---------- Paginated mode ----------
  //
  // One page visible at a time, in the order: ad -> image -> nav bar
  // -> ad. All in normal document flow (NOT position:fixed) — ads
  // scroll naturally with the page like a sandwich around the image,
  // not pinned to the viewport edges. Left-half/right-half invisible
  // tap zones AND the nav bar's prev/next buttons both move pages.
  // Both ad slots refresh every 5 page-turns (scroll mode's own
  // every-9-pages cadence is untouched — this only applies here).
  // Page turns are pure JS (swap which <img> is shown) — never a
  // real navigation — so there's no reload and no scroll-to-top.

  const PAGINATED_AD_REFRESH_EVERY = 5;

  let _pgIndex = 0;          // 0-based current page
  let _pgImages = [];
  let _pgTurnCount = 0;      // turns since last ad refresh
  let _pgLoaded = {};        // cache of Image() objects already requested, by index
  let _pgRefreshPending = false; // a refresh is waiting for the shown page to finish loading
  let _pgAfterLoad = [];         // callbacks to run once the shown page has loaded
  let _pgCycleIndex = 0;     // which 5-turn refresh cycle we're in, for rotation

  function renderPaginated(images){
    const area = document.getElementById('pagesArea');
    if (!area) return;

    beginRender();                 // drops the previous mode's observers + queued ads
    _pgRefreshPending = false;
    _pgAfterLoad = [];

    _pgImages = images;
    _pgIndex = 0;
    _pgTurnCount = 0;
    _pgLoaded = {};
    _pgCycleIndex = 0;

    area.innerHTML =
      '<div class="paginated-wrap">' +
        '<div class="ad-slot-container ad-pending" id="pgAdTop" data-ad-slot="top"></div>' +
        '<div class="paginated-stage pg-loading" id="pgStage">' +
          '<img id="pgImage" alt="">' +
          '<div class="tap-zone left" id="pgTapLeft"></div>' +
          '<div class="tap-zone right" id="pgTapRight"></div>' +
        '</div>' +
        '<div class="paginated-nav">' +
          '<button id="pgFirst" title="First page">&laquo;</button>' +
          '<button id="pgPrev" title="Previous page">&lsaquo;</button>' +
          '<span class="pg-counter" id="pgCounter"></span>' +
          '<button id="pgNext" title="Next page">&rsaquo;</button>' +
          '<button id="pgLast" title="Last page">&raquo;</button>' +
        '</div>' +
        '<div class="ad-slot-container ad-pending" id="pgAdBottom" data-ad-slot="bottom"></div>' +
      '</div>';

    document.getElementById('pgTapLeft').addEventListener('click', function(){ pgTurn(-1); });
    document.getElementById('pgTapRight').addEventListener('click', function(){ pgTurn(1); });
    document.getElementById('pgPrev').addEventListener('click', function(){ pgTurn(-1); });
    document.getElementById('pgNext').addEventListener('click', function(){ pgTurn(1); });
    document.getElementById('pgFirst').addEventListener('click', function(){ pgJump(0); });
    document.getElementById('pgLast').addEventListener('click', function(){ pgJump(_pgImages.length - 1); });

    // Loading order: skeleton (already showing) -> top ad request -> page 1
    // -> bottom ad once page 1 has loaded. With rotation on, top and bottom
    // each start on their own network for cycle 0 (see networkForCycle);
    // otherwise both use the Active Network, as before.
    const token = _renderToken;
    const rot = rotationEnabled();
    injectAdSlots(document.querySelectorAll('#pgAdTop'), rot ? networkForCycle(0, 0) : undefined);
    pgShow(0);
    pgPreloadAround(0);
    pgWhenCurrentLoaded(function(){
      if (token !== _renderToken) return;
      injectAdSlots(document.querySelectorAll('#pgAdBottom'), rot ? networkForCycle(0, 1) : undefined);
    });
  }

  function pgShow(index){
    if (index < 0 || index >= _pgImages.length) return;
    _pgIndex = index;
    const img = document.getElementById('pgImage');
    const stage = document.getElementById('pgStage');
    if (img) {
      // Stage keeps its size + shimmers until this page has loaded.
      if (stage) stage.classList.add('pg-loading');
      const shown = index;
      const finish = function(){
        img.onload = img.onerror = null;
        if (_pgIndex !== shown) return;      // reader already moved on
        if (stage) stage.classList.remove('pg-loading');
        const area = document.getElementById('pagesArea');
        if (area) adoptRatio(area, img);
        const cbs = _pgAfterLoad.splice(0);
        cbs.forEach(function(cb){ cb(); });
      };
      img.onload = finish;
      img.onerror = finish;
      img.src = _pgImages[index];
      img.alt = 'Page ' + (index + 1);
      if (img.complete && img.naturalWidth > 0) finish();   // already cached
    }
    const counter = document.getElementById('pgCounter');
    if (counter) counter.textContent = (index + 1) + ' / ' + _pgImages.length;

    const prevBtn = document.getElementById('pgPrev');
    const nextBtn = document.getElementById('pgNext');
    const firstBtn = document.getElementById('pgFirst');
    const lastBtn = document.getElementById('pgLast');
    if (prevBtn) prevBtn.disabled = (index <= 0);
    if (firstBtn) firstBtn.disabled = (index <= 0);
    if (nextBtn) nextBtn.disabled = (index >= _pgImages.length - 1);
    if (lastBtn) lastBtn.disabled = (index >= _pgImages.length - 1);
  }

  // Runs cb once the page currently on screen has finished loading (or
  // right away if it already has). Ads are tied to this so they're
  // requested after the block's page is in, not before.
  function pgWhenCurrentLoaded(cb){
    const stage = document.getElementById('pgStage');
    if (!stage || !stage.classList.contains('pg-loading')) { cb(); return; }
    _pgAfterLoad.push(cb);
    // Safety net: a broken image must never hold an ad back forever.
    setTimeout(function(){
      const i = _pgAfterLoad.indexOf(cb);
      if (i >= 0) { _pgAfterLoad.splice(i, 1); cb(); }
    }, 3500);
  }

  // Preloads the current page plus the next 2 (3 total in flight/cached)
  // so tapping forward feels instant rather than load-then-wait.
  function pgPreloadAround(index){
    for (let offset = 0; offset <= 2; offset++){
      const i = index + offset;
      if (i >= _pgImages.length || _pgLoaded[i]) continue;
      const im = new Image();
      im.src = _pgImages[i];
      _pgLoaded[i] = im;
    }
  }

  // Every PAGINATED_AD_REFRESH_EVERY page-turns the top/bottom ads are
  // re-requested — but only once the page the reader is on has actually
  // loaded (the block is "in"), never mid-load.
  function pgMaybeRefreshAds(){
    _pgTurnCount++;
    if (_pgTurnCount < PAGINATED_AD_REFRESH_EVERY || _pgRefreshPending) return;
    _pgTurnCount = 0;
    _pgCycleIndex++;
    _pgRefreshPending = true;
    const cycle = _pgCycleIndex;
    const token = _renderToken;
    pgWhenCurrentLoaded(function(){
      _pgRefreshPending = false;
      if (token !== _renderToken) return;
      pgRefreshAds(cycle);
    });
  }

  function pgRefreshAds(cycle){
    const _net = activeNetwork();
    if (rotationEnabled()) {
      // Top and bottom each get their own network for the new cycle —
      // may genuinely differ from each other (see networkForCycle).
      // Hilltop's single-load-per-zone limitation still applies: if
      // Hilltop happens to own a slot this cycle, that slot simply
      // doesn't get a fresh reload (same restriction it always had),
      // while the OTHER slot (if owned by Mondiad/native) still
      // refreshes normally.
      const topNet = networkForCycle(cycle, 0);
      const bottomNet = networkForCycle(cycle, 1);
      const pgTop = document.getElementById('pgAdTop');
      const pgBottom = document.getElementById('pgAdBottom');
      // Hilltop's "never fill twice" guard (data-hilltop-loaded) only
      // stops the SAME already-filled Hilltop slot being re-requested; it
      // must not lock a slot out of Hilltop forever after rotation moved
      // it to another network and back.
      if (pgTop && topNet !== 'hilltop') pgTop.removeAttribute('data-hilltop-loaded');
      if (pgBottom && bottomNet !== 'hilltop') pgBottom.removeAttribute('data-hilltop-loaded');
      if (topNet !== 'hilltop') {
        refreshAdSlots(document.querySelectorAll('#pgAdTop'), topNet);
      }
      if (bottomNet !== 'hilltop') {
        refreshAdSlots(document.querySelectorAll('#pgAdBottom'), bottomNet);
      }
    } else if (_net !== 'hilltop') {
      // Hilltop MultiTag banners are single-load scripts: re-injecting the
      // same zone code repeatedly would stack duplicate loads. Mondiad
      // gets a fresh request (queued one at a time by the ad engine).
      refreshAdSlots(document.querySelectorAll('#pgAdTop, #pgAdBottom'));
    }
  }

  function pgTurn(delta){
    const next = _pgIndex + delta;
    if (next < 0 || next >= _pgImages.length) return; // no-op at the ends

    pgShow(next);
    pgPreloadAround(next);
    pgMaybeRefreshAds();
  }

  // Direct jump (first/last buttons) — same ad-refresh counting as a
  // normal turn, since it's still one navigation action by the reader.
  function pgJump(index){
    if (index === _pgIndex) return;
    pgShow(index);
    pgPreloadAround(index);
    pgMaybeRefreshAds();
  }


  function escapeHTML(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function escapeAttr(str){
    return String(str).replace(/"/g, '&quot;');
  }

  // Turns a tag/artist name into arccomic.github.io's own URL-slug
  // format so links line up with that site's existing pattern, e.g.
  // "Okumori Boy" -> "okumori-boy", "Mojarin" -> "mojarin". Lowercase,
  // spaces/underscores -> hyphens, strip anything that isn't
  // alphanumeric or a hyphen, collapse repeats, trim leading/trailing
  // hyphens.
  function slugify(str){
    return String(str)
      .toLowerCase()
      .trim()
      .replace(/[\s_]+/g, '-')
      .replace(/[^a-z0-9-]/g, '')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');
  }

  async function loadSiteConfig(){
    try{
      const res = await fetch('site-config.json', { cache: 'no-store' });
      if (res.ok) siteConfig = await res.json();
    } catch(err){
      // Branding is optional — a missing/unreachable site-config.json
      // should never block the comic itself from rendering.
      siteConfig = null;
    }
    renderHeader(siteConfig);
  }

  async function init(){
    // Start downloading the comic's JSON right away, in parallel with the
    // site config, instead of waiting for the config first. The skeleton is
    // already on screen (static HTML), so this is pure time saved.
    const code = getCodeFromURL();
    const dataFetch = code
      ? fetch('data/' + encodeURIComponent(code) + '.json', { cache: 'no-store' }).catch(function(){ return null; })
      : null;

    await loadSiteConfig();

    if (!code){
      renderNotAvailable('No comic code was provided in the link.');
      return;
    }

    try{
      const res = await dataFetch;
      if (!res) throw new Error('fetch failed');
      if (!res.ok){
        renderNotAvailable('This comic isn\'t in our library yet. Check back later.');
        return;
      }
      const data = await res.json();
      if (!data || !Array.isArray(data.images) || data.images.length === 0){
        renderNotAvailable('This comic\'s pages couldn\'t be loaded.');
        return;
      }
      renderComic(data);
    } catch(err){
      renderNotAvailable('Something went wrong loading this comic. Please try again.');
    }
  }

  init();
})();
</script>

<script>
(function(){
  var KEY = 'ageGateOk_v1';
  var LEAVE_URL = 'https://t.me/ArcComic';   // <-- where "Leave" sends people

  // Search-engine / preview crawlers never see the gate.
  var ua = (navigator.userAgent || '');
  var isBot = /googlebot|bingbot|slurp|duckduckbot|baiduspider|yandex|sogou|exabot|facebot|ia_archiver|applebot|petalbot|semrush|ahrefs|mj12bot|telegrambot|twitterbot|whatsapp|discordbot/i.test(ua);

  if (!gate) return;

  var ok = false;
  try { ok = window.localStorage.getItem(KEY) === '1'; } catch(e) { ok = false; }
  if (ok) return;                       // already verified on this browser

  gate.classList.add('show');
  document.documentElement.style.overflow = 'hidden';   // stop background scroll while gate is up

  function closeGate(){
    gate.classList.remove('show');
    document.documentElement.style.overflow = '';

  document.getElementById('agYes').addEventListener('click', function(){
    try { window.localStorage.setItem(KEY, '1'); } catch(e) {}
    closeGate();
  });

  document.getElementById('agNo').addEventListener('click', function(){
    window.location.href = LEAVE_URL;    // only on a real click
  });
})();
